---
# SPDX-License-Identifier: GPL-2.0-or-later
config:
  # Markdown is soft-wrapped; commands, URLs and tables can exceed prose width.
  MD013: false
  # Repeated subheadings are useful under different implementation tasks.
  MD024:
    siblings_only: true
  # The VST Compatible logo at a set width (scripts/trademarks.py writes it), and
  # <a id> anchors that keep the links to sections moved to another page.
  MD033:
    allowed_elements: [img, a]
ignores:
  - 'archives/**'
  - 'historical/**'
  - 'source/**'
  - 'review/**'
  - 'docs/archive/**'
  - 'docs/historical/**'
  # Kept byte for byte from published releases (COMPAT-1).
  - 'tests/upgrade/*/**'
