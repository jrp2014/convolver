---
# SPDX-License-Identifier: GPL-2.0-or-later
# Preserve recovered source/documents and archived review evidence.
exclude: >-
  ^(archives/|historical/|source/|review/|docs/historical/|docs/archive/)

repos:
  - repo: https://github.com/ryanrhee/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.22.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict]
  - repo: local
    hooks:
      - id: clang-format
        name: C++ formatting (latest stable clang-format, reformats in place)
        entry: python scripts/check_format.py --fix
        language: python
        additional_dependencies:
          - clang-format
        pass_filenames: false
        files: >-
          (\.(h|hpp|cpp|mm)|^\.clang-format(-ignore)?|^scripts/check_format\.(py|sh)|^\.pre-commit-config\.yaml)$
      - id: format-tool-tests
        name: Stable formatter discovery tests
        entry: python tests/format_tools_tests.py
        language: python
        pass_filenames: false
        always_run: true
      - id: cloud-setup-tests
        name: Cloud tooling setup tests
        entry: python tests/cloud_setup_tests.py
        language: python
        pass_filenames: false
        always_run: true
      - id: documentation-links
        name: Maintained documentation links and anchors
        entry: python scripts/check_doc_links.py
        language: python
        pass_filenames: false
        always_run: true
      - id: documentation-link-tests
        name: Documentation link checker tests
        entry: python tests/documentation_links_tests.py
        language: python
        pass_filenames: false
        always_run: true
      - id: repository-rules
        name: Repository rules (TODO IDs, docs index, plans, paths, SPDX, layout)
        entry: python scripts/check_repository.py
        language: python
        pass_filenames: false
        always_run: true
      - id: repository-rule-tests
        name: Repository rule checker tests
        entry: python tests/repository_checks_tests.py
        language: python
        pass_filenames: false
        always_run: true
      - id: plugin-identities
        name: Permanent plug-in identities (PLUG-4 registry)
        entry: python tests/identities_tests.py
        language: python
        pass_filenames: false
        always_run: true
      - id: ci-scope-tests
        name: CI scope for documentation-only pull requests
        entry: python tests/ci_scope_tests.py
        language: python
        pass_filenames: false
        always_run: true
      - id: actionlint
        name: GitHub Actions and embedded ShellCheck
        entry: actionlint
        language: python
        additional_dependencies:
          - actionlint-py==1.7.12.25
          - shellcheck-py==0.11.0.1
        types: [yaml]
        files: ^\.github/workflows/
        args: [-shellcheck=shellcheck]
