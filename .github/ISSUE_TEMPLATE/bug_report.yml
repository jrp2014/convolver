# Asks for what docs/use/report-a-problem.md tells users to collect.
name: Problem report
description: Convolver crashed, played the wrong thing, or refused a filter it should accept.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for reporting a problem.
        [Report a problem](https://github.com/jrp2014/convolver/blob/main/docs/use/report-a-problem.md)
        says what to collect on macOS, Windows and Linux. Please keep private
        audio and session files out of the report, and use the bundled examples
        (the package's `presets/` folder, or `examples/first-use/`) to show the
        problem where you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System version and processor
      description: For example macOS 26.1 on Apple M2, Windows 11 on x64, or Ubuntu 24.04 on x64.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Convolver version or package
      description: >-
        The version (every line of the Convolver log names it, as do
        Convolver's window and `convolver --version`), or the name of the
        file you downloaded.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where you used it
      multiple: true
      options:
        - Installing (package or installer)
        - Command-line tool (convolver)
        - VST3 plug-in
        - Audio Unit plug-in
        - LV2 plug-in
        - Preset tool (convolver-preset)
        - Equalizer APO export
        - C++ library
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
      description: For a plug-in, the host program and its version (for example REAPER 7.2).
  - type: input
    id: audio
    attributes:
      label: Audio settings
      description: Sample rate, input and output channel counts, and buffer size.
  - type: dropdown
    id: loading
    attributes:
      label: How the filter was loaded (plug-ins)
      multiple: true
      options:
        - Choose… or dropped on Convolver's window
        - Recent or Reload in Convolver's window
        - A preset from the host's preset menu
        - A reopened project
        - The host's file chooser (LV2)
  - type: dropdown
    id: where
    attributes:
      label: Where the problem shows (plug-ins)
      multiple: true
      options:
        - What you hear while playing
        - An export or render
        - After reopening the project
  - type: textarea
    id: messages
    attributes:
      label: Messages
      description: >-
        macOS: press Copy Diagnostics in Convolver's window and paste it here.
        Windows and Linux: drag the Convolver log file here, and paste the
        plug-in's Status text if the host shows it. Command-line tools: paste
        the command and its whole message. The log names file paths, which can
        include your user name; edit them out if you prefer.
  - type: textarea
    id: filter
    attributes:
      label: Filter
      description: >-
        The `.cfg` file or a description of the IR files (channels, length,
        sample rate). The smallest example that shows the problem helps most.
