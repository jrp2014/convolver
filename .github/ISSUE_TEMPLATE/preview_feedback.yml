---
# SPDX-License-Identifier: GPL-2.0-or-later
# Feedback from people trying a preview: what worked, not only what failed.
name: Preview feedback
description: Tell us how trying a preview went, what was hard to follow, or what you missed.
title: 'Preview feedback: '
body:
  - type: markdown
    attributes:
      value: >-
        Thank you for trying Convolver. Short answers are fine; anything that
        worked is as useful to hear as anything that did not. For a crash, wrong
        sound or a refused filter, use Problem report instead.
  - type: dropdown
    id: platform
    attributes:
      label: System
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Convolver version or package
      description: The version, or the name of the file you downloaded.
  - type: dropdown
    id: tried
    attributes:
      label: What you tried
      multiple: true
      options:
        - Installing (package or installer)
        - Command-line tool
        - A plug-in in a host
        - Plug-in presets (convolver-preset)
        - Equalizer APO export
        - My own filter
        - Following one of the guides
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host
      description: For a plug-in, the host program and its version (for example REAPER 7.2).
  - type: textarea
    id: worked
    attributes:
      label: What worked
  - type: textarea
    id: hard
    attributes:
      label: What was hard to follow or did not work
      description: Name the guide or step if one was unclear.
  - type: textarea
    id: missing
    attributes:
      label: What you would need next
      description: A host, format, feature or instruction that would make Convolver useful to you.
