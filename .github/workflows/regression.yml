name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-regressions:
    name: Portable regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Ubuntu's clang ships without the sanitizer runtimes the suites link against.
      - name: Install Clang sanitizer runtimes
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-rt-18-dev
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100

      - name: Show toolchain
        run: |
          clang++ --version
          python3 --version

      - name: Run portable regression suites
        run: python3 tests/regression/run_all.py
