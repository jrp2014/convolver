---
# SPDX-License-Identifier: GPL-2.0-or-later
name: Native and historical tests

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only documentation skip the builds and tests
  # (scripts/ci_scope.py, docs/develop/testing.md#documentation-only-pull-requests).
  scope:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --github-output "$GITHUB_OUTPUT"

  unix:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    name: ${{ matrix.os }} / ${{ matrix.cxx }} / ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Checks of the repository itself (CTest label "repository") run in
          # one full build per OS; see docs/develop/testing.md#which-configurations-run-which-tests.
          - os: ubuntu-latest
            cxx: clang++
            build: Debug
            sanitizers: 'ON'
            full_tests: ''
          - os: ubuntu-latest
            cxx: g++
            build: Release
            sanitizers: 'OFF'
            full_tests: -LE repository
          - os: macos-latest
            cxx: clang++
            build: Debug
            sanitizers: 'ON'
            full_tests: ''
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libsndfile1-dev serdi
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install fftw libsndfile
      # Compiler cache: pull requests restore it; main and manual runs also
      # save it (docs/develop/testing.md#compiler-cache).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: native-${{ matrix.os }}-${{ matrix.cxx }}-${{ matrix.build }}
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DCONVOLVER_SANITIZERS=${{ matrix.sanitizers }}
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
      - name: Build production targets and tests
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --output-junit junit.xml --parallel 2 ${{ matrix.full_tests }}
      # Formatting is checked by the lint workflow (pre-commit), not here.
      - name: Portable static analysis
        if: runner.os == 'Linux' && matrix.cxx == 'clang++'
        run: |
          python -m pip install --upgrade clang-tidy
          clang-tidy --version
          clang-tidy -p build portable/engine.cpp portable/kernels.cpp portable/kernels_avx2.cpp \
            portable/attenuation.cpp portable/config.cpp \
            portable/config_parse.cpp portable/inspection.cpp portable/inspection_cli.cpp \
            portable/dither_advice.cpp portable/io.cpp \
            portable/main.cpp portable/fft_fftw.cpp portable/host.cpp portable/host_log.cpp portable/host_report.cpp \
            portable/filter_file.cpp portable/state.cpp \
            portable/presets.cpp portable/preset_main.cpp portable/equalizer_apo.cpp \
            portable/equalizer_apo_main.cpp
      - name: Linked versions
        run: ./build/convolver --version
      - name: Core-only preset without file or Python dependencies
        run: |
          cmake --preset core-only -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_DISABLE_FIND_PACKAGE_ConvolverSndFile=ON -DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON
          cmake --build --preset core-only
          ctest --preset core-only --output-junit junit.xml
      - name: Configure Accelerate
        if: runner.os == 'macOS'
        run: >-
          cmake -S . -B build-accelerate -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
          -DCONVOLVER_FFT_BACKEND=ACCELERATE -DCONVOLVER_SANITIZERS=ON -DCONVOLVER_LEGACY_TESTS=OFF
      - name: Build and test Accelerate
        if: runner.os == 'macOS'
        run: |
          cmake --build build-accelerate --parallel 2
          ctest --test-dir build-accelerate --output-on-failure --output-junit junit.xml --parallel 2 -LE repository
          ./build-accelerate/convolver --version
      - name: Compare FFTW and Accelerate output
        if: runner.os == 'macOS'
        run: python tests/native/backend_equivalence.py build/convolver build-accelerate/convolver
      - name: Build and test the dependency-free Ooura backend
        run: |
          cmake -S . -B build-ooura -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DCONVOLVER_SANITIZERS=${{ matrix.sanitizers }} \
            -DCONVOLVER_FFT_BACKEND=OOURA -DCONVOLVER_LEGACY_TESTS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_ConvolverFFTW=ON
          cmake --build build-ooura --parallel 2
          ctest --test-dir build-ooura --output-on-failure --output-junit junit.xml --parallel 2 -LE repository
          ./build-ooura/convolver --version
      - name: Compare FFTW and Ooura output
        run: python tests/native/backend_equivalence.py build/convolver build-ooura/convolver
      # DIAG-1: a failed run keeps CTest's full output (sanitizer reports and
      # lifecycle reproductions included), JUnit results and build identity.
      - name: Collect test evidence
        if: failure()
        run: python3 scripts/ci_evidence.py test-evidence build build/presets/core-only build-accelerate build-ooura
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: test-evidence
          retention-days: 14
          if-no-files-found: ignore
  windows:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Prepare vcpkg binary cache
        id: vcpkg-cache
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;default,readwrite" >> $env:GITHUB_ENV
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the vcpkg revision' }
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Cache vcpkg binary archives
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: >-
            ${{ format('vcpkg-v1-{0}-{1}-x64-windows--{2}-{3}-{4}',
            runner.os, runner.arch, steps.vcpkg-cache.outputs.image,
            steps.vcpkg-cache.outputs.revision, hashFiles('.github/workflows/regression.yml')) }}
          restore-keys: |
            vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-x64-windows--
      - name: Install native dependencies
        run: vcpkg install 'fftw3[core,sse2,avx,avx2]:x64-windows' 'libsndfile[core]:x64-windows'
      # HOST-4: Equalizer APO's own Benchmark.exe runs the exported configurations.
      # The installer is unpacked, not run, so no audio driver is changed; only
      # the registry value naming the configuration folder is set.
      - name: Unpack Equalizer APO
        env:
          EQUALIZER_APO_VERSION: 1.4.2
          EQUALIZER_APO_SHA256: 7403be7427bbe1936a40dded082829b6e217fc4f5990fee5cba501f0ae055afa
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'equalizer-apo'
          $installer = Join-Path $env:RUNNER_TEMP 'EqualizerAPO-x64.exe'
          $version = $env:EQUALIZER_APO_VERSION
          $url = "https://sourceforge.net/projects/equalizerapo/files/$version/EqualizerAPO-x64-$version.exe/download"
          curl.exe -fsSL --retry 3 -o $installer $url
          if ($LASTEXITCODE -ne 0) { throw "Cannot download Equalizer APO from $url" }
          $digest = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($digest -ne $env:EQUALIZER_APO_SHA256) { throw "Unexpected Equalizer APO checksum $digest" }
          7z x -y "-o$directory" $installer | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Cannot unpack the Equalizer APO installer' }
          $config = Join-Path $env:RUNNER_TEMP 'equalizer-apo-config'
          New-Item -ItemType Directory -Force -Path $config | Out-Null
          New-Item -Force -Path 'HKLM:\SOFTWARE\EqualizerAPO' | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\EqualizerAPO' -Name ConfigPath -Value $config
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\EqualizerAPO' -Name EnableTrace -Value 'false'
          "EQUALIZER_APO_BENCHMARK=$(Join-Path $directory 'Benchmark.exe')" >> $env:GITHUB_ENV
          "EQUALIZER_APO_CONFIG=$config" >> $env:GITHUB_ENV
      - name: Configure MSVC
        run: >-
          cmake -S . -B build -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows -DCONVOLVER_LEGACY_TESTS=OFF
          "-DCONVOLVER_EQUALIZER_APO_BENCHMARK=$env:EQUALIZER_APO_BENCHMARK"
          "-DCONVOLVER_EQUALIZER_APO_CONFIG=$env:EQUALIZER_APO_CONFIG"
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test native libraries and CLI
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2 --output-junit junit.xml
      - name: Linked versions
        run: ./build/Release/convolver.exe --version
      - name: Core-only MSVC build and consumer tests
        run: >-
          cmake -S . -B build-core -A x64
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows -DCONVOLVER_BUILD_IO=OFF -DCONVOLVER_BUILD_CLI=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_ConvolverSndFile=ON -DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON

          cmake --build build-core --config Release --parallel 2

          ctest --test-dir build-core -C Release --output-on-failure --parallel 2 --output-junit junit.xml
      - name: Core-only MSVC build with the Ooura backend
        run: >-
          cmake -S . -B build-ooura -A x64 -DCONVOLVER_FFT_BACKEND=OOURA
          -DCONVOLVER_BUILD_IO=OFF -DCONVOLVER_BUILD_CLI=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_ConvolverFFTW=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_ConvolverSndFile=ON -DCMAKE_DISABLE_FIND_PACKAGE_Python3=ON

          cmake --build build-ooura --config Release --parallel 2

          ctest --test-dir build-ooura -C Release --output-on-failure --parallel 2 --output-junit junit.xml
      # DIAG-1: a failed run keeps CTest's full output (sanitizer reports and
      # lifecycle reproductions included), JUnit results and build identity.
      - name: Collect test evidence
        if: failure()
        run: python scripts/ci_evidence.py test-evidence build build-core build-ooura
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: test-evidence
          retention-days: 14
          if-no-files-found: ignore
