name: Native and historical tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unix:
    name: ${{ matrix.os }} / ${{ matrix.cxx }} / ${{ matrix.build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cxx: clang++
            build: Debug
            sanitizers: 'ON'
          - os: ubuntu-latest
            cxx: g++
            build: Release
            sanitizers: 'OFF'
          - os: macos-latest
            cxx: clang++
            build: Debug
            sanitizers: 'ON'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libsndfile1-dev
      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install fftw libsndfile
      - name: Configure
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} -DCMAKE_BUILD_TYPE=${{ matrix.build }} -DCONVOLVER_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build production targets and tests
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2
      - name: Linked versions
        run: ./build/convolver --version
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native dependencies
        run: vcpkg install fftw3:x64-windows 'libsndfile[core]:x64-windows'
      - name: Configure MSVC
        run: cmake -S . -B build -A x64 "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows -DCONVOLVER_LEGACY_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test native libraries and CLI
        run: ctest --test-dir build -C Release --output-on-failure --parallel 2
      - name: Linked versions
        run: ./build/Release/convolver.exe --version
