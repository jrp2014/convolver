---
# SPDX-License-Identifier: GPL-2.0-or-later
name: Draft preview release

# REL-8: turns a passed candidate run on a vX.Y.Z tag into a DRAFT GitHub
# pre-release, with every platform's files (macOS, Windows and Linux since
# REL-9), the corresponding source and generated notes. First the Windows and
# Linux files run on machines that never built Convolver (clean-machines).
# A draft is visible only to people with write access; nothing is public
# until jrp reads it and presses Publish
# (docs/develop/releasing.md#publishing-an-unsigned-preview).
# REL-1: with "production", a draft full release instead, only once the
# candidate meets every production gate: this checkout's release policy
# (production_enabled and each platform's production rules) and its evidence
# file, packaging/evidence/X.Y.Z.json (docs/develop/releasing.md#production-gates).
'on':
  workflow_dispatch:
    inputs:
      run_id:
        description: >-
          Run ID of a passed "Plug-in distribution candidates" run started by
          hand on the vX.Y.Z tag (the number in the run's address)
        required: true
      qualification:
        description: >-
          Loading responsiveness (REL-6) result for the release notes, for
          example "Qualified on a MacBook Pro (M1 Pro, 32 GB, macOS 15.1)"
        required: true
      release:
        description: >-
          A preview (a pre-release), or a production (full) release, which
          refuses unless every production gate is met
        type: choice
        options: [preview, production]
        default: preview
  # A dry run on the newest such run when this workflow or its scripts
  # change: every check and the notes, for a preview and for a production
  # release (listing the production gates not yet met), but no draft.
  pull_request:
    paths:
      - .github/workflows/publish.yml
      - packaging/release-policy.json
      - packaging/evidence/**
      - scripts/release/prepare_release.py
      - scripts/release/promotion_gate.py
      - scripts/release/contract.py
      - tests/release/clean_machine.py
      - tests/release/package_smoke.py
      - tests/release/lv2_bundle.py
      - plugins/lv2/generate_ttl.py
      - tests/release/documentation_examples.py
      - scripts/release/candidate.py
      - scripts/release/installers.py
      - scripts/trademarks.py
      - plugins/identities.json

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'draft' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      tag: ${{ steps.run.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Find the candidate run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          mkdir -p build
          if [ -z "$RUN_ID" ] && [ "$EVENT" != pull_request ]; then
            echo "::error::Give the candidate run's ID (the number in its address)."
            exit 1
          fi
          if [ -z "$RUN_ID" ]; then
            runs="repos/$REPO/actions/workflows/release.yml/runs?event=workflow_dispatch&status=success&per_page=50"
            tagged='select((.head_branch // "") | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))'
            RUN_ID=$(gh api "$runs" --jq "[.workflow_runs[] | $tagged][0].id // empty")
            if [ -z "$RUN_ID" ]; then
              echo "::error::No passed candidate run on a vX.Y.Z tag to rehearse with."
              exit 1
            fi
            echo "Dry run with run $RUN_ID, the newest passed candidate run on a tag."
          fi
          if ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::The run ID is the number in the run's address, not '$RUN_ID'."
            exit 1
          fi
          gh api "repos/$REPO/actions/runs/$RUN_ID" > build/run.json
          tag=$(jq -r .head_branch build/run.json)
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run $RUN_ID built '$tag', not a vX.Y.Z tag." \
              "Run the candidate workflow by hand on the tag first."
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      # jrp, 21 November 2026: every release and preview gets the full CI.
      # Pull requests and main can carry a passed result forward (CI-53), so
      # each workflow must also have passed when started by hand on the tag
      # itself (not a branch at the same commit), which always runs everything
      # (docs/develop/releasing.md#publishing-an-unsigned-preview).
      - name: Check that the full CI passed on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ steps.run.outputs.tag }}
        run: |
          sha=$(jq -r .head_sha build/run.json)
          missing=()
          for workflow in regression vst3 lv2 au fuzz lint; do
            runs="repos/$REPO/actions/workflows/$workflow.yml/runs?event=workflow_dispatch&branch=$TAG&head_sha=$sha&status=success"
            # On its own line, so that a failed lookup stops the step.
            count=$(gh api "$runs" --jq .total_count)
            if [ "$count" -lt 1 ]; then
              missing+=("$workflow")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            message="No passed run started by hand on $TAG ($sha) for: ${missing[*]}."
            message="$message Start each on the tag (gh workflow run <name>.yml --ref $TAG) and wait for it to pass."
            if [ "$EVENT" = pull_request ]; then
              echo "::warning::Dry run: $message"
            else
              echo "::error::$message"
              exit 1
            fi
          else
            echo "Every workflow passed when started by hand on $TAG ($sha)."
          fi
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.run.outputs.tag }}
          path: tagged
      - name: Download the run's complete candidate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.run.outputs.run_id }}
        run: gh run download "$RUN_ID" -R "$REPO" -n complete-preview-candidate -D build/candidate
      - name: Check the candidate and write the release notes
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.run.outputs.tag }}
          QUALIFICATION: ${{ inputs.qualification }}
          EVENT: ${{ github.event_name }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            QUALIFICATION='Dry run: no qualification result.'
          fi
          # A production release is judged by this checkout's (main's) policy
          # and evidence file, not the tag's (prepare_release.py).
          production=()
          if [ "$RELEASE" = production ]; then
            production=(--production --evidence "packaging/evidence/${TAG#v}.json")
          fi
          python scripts/release/prepare_release.py --run build/run.json --root build/candidate \
            --tagged tagged --tag "$TAG" --repository "$REPO" --qualification "$QUALIFICATION" \
            --output build/release "${production[@]}"
          {
            echo "## $(cat build/release/title.txt)"
            echo
            cat build/release/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      # REL-1: what a production release of the same candidate would lack.
      - name: 'Dry run: a production release of the same candidate'
        if: github.event_name == 'pull_request'
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.run.outputs.tag }}
        run: |
          python scripts/release/prepare_release.py --run build/run.json --root build/candidate \
            --tagged tagged --tag "$TAG" --repository "$REPO" --qualification 'Dry run: no qualification result.' \
            --output build/production --production --evidence "packaging/evidence/${TAG#v}.json" --dry-run \
            | tee build/production.log
          {
            echo "## Dry run: $(cat build/production/title.txt)"
            echo
            echo "Production gates not yet met:"
            echo
            sed -n 's/^::warning::Not ready for a production release: /- /p' build/production.log
            echo
            cat build/production/notes.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: draft-release
          path: build/release/*
          if-no-files-found: error

  # REL-9: the exact Windows and Linux files on machines that never built
  # Convolver: stock distribution images with only Python added, and a
  # Windows image other than the one that built the package, where the
  # installer is installed and removed silently (tests/release/clean_machine.py).
  # A real run takes the scripts from the tag, as the files are; the dry run
  # for a pull request takes them from the pull request.
  clean-machines:
    needs: prepare
    name: Clean machine (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04
            os: ubuntu-latest
            container: ubuntu:22.04
            platform: linux-x86_64
          - name: Ubuntu 24.04
            os: ubuntu-latest
            container: ubuntu:24.04
            platform: linux-x86_64
          - name: Debian 12
            os: ubuntu-latest
            container: debian:12
            platform: linux-x86_64
          - name: Fedora
            os: ubuntu-latest
            container: fedora:latest
            platform: linux-x86_64
          - name: Windows Server 2025
            os: windows-2025
            container: ''
            platform: windows-x86_64
            install: --install
            python: python
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Add Python, and nothing else, to the image
        if: matrix.container != ''
        shell: sh
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends python3
          else
            dnf install -y -q python3
          fi
      - uses: actions/setup-python@v7
        if: matrix.container == ''
        with:
          python-version: '3.x'
      - uses: actions/checkout@v7
        with:
          ref: >-
            ${{ github.event_name == 'workflow_dispatch'
            && format('refs/tags/{0}', needs.prepare.outputs.tag) || '' }}
      - uses: actions/download-artifact@v8
        with:
          name: complete-preview-candidate
          path: build/candidate
          run-id: ${{ needs.prepare.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Run the published files
        env:
          PYTHONUNBUFFERED: '1'
        run: >-
          ${{ matrix.python || 'python3' }} tests/release/clean_machine.py --candidate build/candidate
          --platform ${{ matrix.platform }} ${{ matrix.install }}

  draft:
    needs: [prepare, clean-machines]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: draft-release
          path: build/release
      - name: Create the draft release and check its files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.prepare.outputs.run_id }}
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE: ${{ inputs.release }}
        run: |
          # A preview is a pre-release; a production release, which the
          # prepare job let through only with every production gate met, is not.
          kind=(--prerelease)
          if [ "$RELEASE" = production ]; then
            kind=()
          fi
          # Listed over REST so that a failed lookup stops here rather than
          # passing for "none"; GitHub allows several drafts on one tag.
          existing=$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | wc -l)
          if [ "$existing" -ne 0 ]; then
            echo "::error::A release or draft for $TAG already exists. Delete an unwanted draft first;" \
              "a published preview is never replaced (a fix gets a new version)."
            exit 1
          fi
          gh run download "$RUN_ID" -R "$REPO" -n complete-preview-candidate -D build/candidate
          (cd build/candidate && sha256sum --strict -c ../release/SHA256SUMS)
          mapfile -t names < <(cut -d' ' -f3- build/release/SHA256SUMS)
          (cd build/candidate && gh release create "$TAG" -R "$REPO" --draft "${kind[@]}" --verify-tag \
            --title "$(cat ../release/title.txt)" --notes-file ../release/notes.md "${names[@]}")
          # Download every attached file again and compare it with its sum.
          gh release download "$TAG" -R "$REPO" -D build/check
          if ! (cd build/check && sha256sum --strict -c ../release/SHA256SUMS); then
            echo "::error::The draft's files do not match their sums. Delete the draft and run this again."
            exit 1
          fi
          count=$(find build/check -type f | wc -l)
          if [ "$count" -ne "${#names[@]}" ]; then
            echo "::error::The draft holds $count files, not ${#names[@]}."
            exit 1
          fi
          url=$(gh release view "$TAG" -R "$REPO" --json url --jq .url)
          echo "Draft $(cat build/release/title.txt), not yet public: $url" >> "$GITHUB_STEP_SUMMARY"
