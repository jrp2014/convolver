---
# SPDX-License-Identifier: GPL-2.0-or-later
# The Audio Unit adapter (AU-1, AU-2): built against the newest AudioUnitSDK
# release (CI-6; its version, commit and checksum are in the job summary),
# tested through the Audio Unit API and the shared PLUG-2 harness, then
# installed for the user, checked by auval and pluginval (AU-3), and played
# through AVAudioEngine (AU-15).
name: Audio Unit

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Each Monday, so that a new AudioUnitSDK release shows up within a week
  # even when nothing here changes (CI-6).
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only documentation, or only another plug-in
  # format's or workflow's own files (CI-13), skip the builds and tests
  # (scripts/ci_scope.py, docs/develop/testing.md#documentation-only-pull-requests).
  scope:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --workflow au --github-output "$GITHUB_OUTPUT"

  # CI-7: the newest SDK release is resolved once per run, here, and every
  # job below builds exactly that release from this lock file, so the jobs
  # of one run cannot build against different releases.
  sdk:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    name: Newest AudioUnitSDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Resolve and record it
        run: |
          mkdir -p "$RUNNER_TEMP/lock"
          python3 scripts/release/resolve.py dependencies --cache "$RUNNER_TEMP/downloads" \
            --lock "$RUNNER_TEMP/lock/audiounitsdk-lock.json" audiounitsdk
      - uses: actions/upload-artifact@v7
        with:
          name: audiounitsdk-lock
          path: ${{ runner.temp }}/lock/audiounitsdk-lock.json
          if-no-files-found: error
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python3 scripts/release/resolve.py explain-failure --suspect audiounitsdk
  au:
    # Skipped with the sdk job when the scope job finds nothing to build.
    needs: sdk
    # A fixed image label. GitHub still updates its Xcode and macOS point
    # releases, so the versions are logged for each run.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      # Builds and tests use every CPU the runner has.
      - uses: ./.github/actions/use-every-cpu
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: audiounitsdk-lock
          path: ${{ runner.temp }}/lock
      # Resolved once by the sdk job (CI-7).
      - name: Newest AudioUnitSDK
        run: >-
          python scripts/release/sources.py --lock "$RUNNER_TEMP/lock/audiounitsdk-lock.json" --fetch
          --cache "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/sources" audiounitsdk
      - name: Tools and libraries
        run: |
          sw_vers
          xcodebuild -version
          brew install libsndfile
      # Compiler cache: pull requests restore it; main and manual runs also
      # save it (docs/develop/testing.md#compiler-cache).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          key: au-macos-15
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      # AUTO selects Accelerate for plug-in builds on macOS; libsndfile is only
      # for the CLI and the tests, never linked into the component, which reads
      # filter files with AudioToolbox (au.bundle checks its libraries).
      - name: Configure
        run: >-
          cmake -S . -B build-au -DCMAKE_BUILD_TYPE=Release -DCONVOLVER_BUILD_AU=ON
          "-DCONVOLVER_AU_SDK=$RUNNER_TEMP/sources/AudioUnitSDK" -DCONVOLVER_LEGACY_TESTS=OFF
      - name: Build the component, CLI and tests
        run: cmake --build build-au
      - name: Core, CLI, AU adapter and PLUG-2 harness
        # The repository checks and package consumers run in the native jobs
        # (docs/develop/testing.md#which-configurations-run-which-tests).
        run: >-
          ctest --test-dir build-au --output-on-failure --output-junit junit.xml
          -LE 'repository|consumer'
      # CTest shows the timing tests' output only when they fail: print the
      # tables and the summary from its log, also when they passed or were
      # skipped as not qualified (docs/develop/testing.md#load-timing-perf-9).
      - name: Load timings
        if: always()
        shell: bash
        run: >-
          sed -n '/load timing (/,/load timing: /p'
          build-au/Testing/Temporary/LastTest.log || true
      # PERF-13: every callback's record, with the build and machine.
      - name: Keep the load-timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-timing-${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: build-au/*-load-timing/*-load-timing.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Install for this user
        run: |
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          ditto build-au/plugins/au/Convolver.component "$components/Convolver.component"
          # Make the component registrar rescan, as after an installer.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i conv || true
      # AU-6: auval also lists and loads Convolver's window.
      - name: auval (strict)
        shell: bash  # With pipefail, so auval's own failure still fails the step.
        run: |
          auval -strict -v aufx Conv CONV | tee auval.txt
          grep -q "Cocoa Views Available: 1" auval.txt
      # AU-15: Apple's own hosting stack, AVAudioEngine offline rendering,
      # plays the first-use examples through the installed unit with each
      # filter loaded as an .aupreset, and checks them against the oracle.
      - name: AVAudioEngine renders the first-use examples
        run: python tests/au/avaudioengine_tests.py build-au/convolver-preset
      # AU-3: pluginval, a JUCE host, on the installed component, with its
      # editor tests opening the window. The formal check uses the newest
      # full release (CI-6).
      - name: Newest pluginval release
        id: pluginval
        uses: ./.github/actions/pluginval
      - name: pluginval
        env:
          PLUGINVAL: ${{ steps.pluginval.outputs.path }}
          VERSION: ${{ steps.pluginval.outputs.version }}
        run: |
          options=()
          # rtcheck (pluginval 2, macOS) flags real-time-unsafe calls while processing.
          if [ "${VERSION%%.*}" -ge 2 ]; then options+=(--rtcheck relaxed); fi
          python tests/plugins/pluginval.py validate "$PLUGINVAL" \
            "$HOME/Library/Audio/Plug-Ins/Components/Convolver.component" "${options[@]}"
      # A newer beta or release candidate only signposts what is coming:
      # what it reports is a warning, never a failure.
      - name: Newest pluginval pre-release
        id: pluginval-prerelease
        continue-on-error: true
        uses: ./.github/actions/pluginval
        with:
          prerelease: 'true'
      - name: pluginval pre-release (advisory)
        if: always() && steps.pluginval.outcome == 'success'
        env:
          FETCHED: ${{ steps.pluginval-prerelease.outcome }}
          AVAILABLE: ${{ steps.pluginval-prerelease.outputs.available }}
          PLUGINVAL: ${{ steps.pluginval-prerelease.outputs.path }}
          VERSION: ${{ steps.pluginval-prerelease.outputs.version }}
          RELEASE: ${{ steps.pluginval.outputs.version }}
        run: |
          advise() {
            echo "::warning title=pluginval pre-release::$1"
            echo "**Warning:** $1" >> "$GITHUB_STEP_SUMMARY"
          }
          options=()
          if [ "${VERSION%%.*}" -ge 2 ]; then options+=(--rtcheck relaxed); fi
          component="$HOME/Library/Audio/Plug-Ins/Components/Convolver.component"
          if [ "$FETCHED" != success ]; then
            advise 'Cannot fetch the newest pluginval pre-release; see the log of the step before.'
          elif [ "$AVAILABLE" = true ]; then
            if python tests/plugins/pluginval.py validate "$PLUGINVAL" "$component" "${options[@]}"; then
              echo "pluginval $VERSION (pre-release) passes the Audio Unit, as $RELEASE does." \
                >> "$GITHUB_STEP_SUMMARY"
            else
              message="pluginval $VERSION (pre-release) reports Audio Unit problems that $RELEASE does not;"
              advise "$message see the log of this step."
            fi
          fi
      # A new AudioUnitSDK release can need adapter changes (1.4.0 needed C++23).
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python scripts/release/resolve.py explain-failure --suspect audiounitsdk
      # DIAG-1: a failed run keeps CTest's full output (sanitizer reports and
      # lifecycle reproductions included), JUnit results and build identity.
      - name: Collect test evidence
        if: failure()
        run: python scripts/ci_evidence.py test-evidence build-au
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-evidence
          retention-days: 14
          if-no-files-found: ignore
      # CI-22: a pass on re-run says so, so the earlier failure stays visible.
      - name: Note a pass on re-run
        if: success() && github.run_attempt != '1'
        uses: ./.github/actions/note-retry

  # CONVOLVER_SANITIZERS=ON compiles the adapter, AudioUnitSDK and the AU
  # tests with ASan and UBSan (jrp's review of 0.5.5: they were only linked
  # with the runtimes). Only the AU tests run here: the core's sanitizer runs
  # are in the native workflow, and auval cannot load an instrumented bundle.
  # This job also builds the fallbacks, libsndfile for the window's filter
  # files and FFTW for the FFT, so they keep working; the Release job above
  # builds the defaults (AudioToolbox and Accelerate) that packages use.
  au-sanitizers:
    # Skipped with the sdk job when the scope job finds nothing to build.
    needs: sdk
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      # Builds and tests use every CPU the runner has.
      - uses: ./.github/actions/use-every-cpu
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: audiounitsdk-lock
          path: ${{ runner.temp }}/lock
      # Resolved once by the sdk job (CI-7).
      - name: Newest AudioUnitSDK
        run: >-
          python scripts/release/sources.py --lock "$RUNNER_TEMP/lock/audiounitsdk-lock.json" --fetch
          --cache "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/sources" audiounitsdk
      - name: Tools and libraries
        run: brew install libsndfile fftw
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d  # v1.2.24
        with:
          key: au-sanitizers-macos-15
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      - name: Configure
        run: >-
          cmake -S . -B build-au -DCMAKE_BUILD_TYPE=Debug -DCONVOLVER_SANITIZERS=ON
          -DCONVOLVER_BUILD_AU=ON "-DCONVOLVER_AU_SDK=$RUNNER_TEMP/sources/AudioUnitSDK"
          -DCONVOLVER_LEGACY_TESTS=OFF -DCONVOLVER_AU_FILE_READER=LIBSNDFILE
          -DCONVOLVER_FFT_BACKEND=FFTW
      # Only what the au.* tests run (CI-9).
      - name: Build
        run: cmake --build build-au --target convolver_au_suite
      - name: AU adapter, harness and lifecycle under ASan and UBSan
        run: ctest --test-dir build-au --output-on-failure --output-junit junit.xml -L au
      - name: Collect test evidence
        if: failure()
        run: python scripts/ci_evidence.py test-evidence build-au
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-evidence
          retention-days: 14
          if-no-files-found: ignore
      # CI-22: a pass on re-run says so, so the earlier failure stays visible.
      - name: Note a pass on re-run
        if: success() && github.run_attempt != '1'
        uses: ./.github/actions/note-retry
