---
# SPDX-License-Identifier: GPL-2.0-or-later
# The Audio Unit adapter (AU-1, AU-2): built against the newest AudioUnitSDK
# release (CI-6; its version, commit and checksum are in the job summary),
# tested through the Audio Unit API and the shared PLUG-2 harness, then
# installed for the user, checked by auval and pluginval (AU-3), and played
# through AVAudioEngine (AU-15). Debug builds run the AU tests under ASan and
# UBSan, and the adapter test under ThreadSanitizer (AU-3).
name: Audio Unit

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft runs Lint and the Linux jobs only (CI-54).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
  # Each Monday, so that a new AudioUnitSDK release shows up within a week
  # even when nothing here changes (CI-6).
  schedule:
    # The Monday runs with macOS jobs start half an hour apart (candidates
    # 06:23, Audio Unit 06:53, VST3 07:23 UTC), so they do not wait for one
    # another's macOS runners (CI-49).
    - cron: '53 6 * * 1'

permissions:
  contents: read

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only documentation, or only another plug-in
  # format's or workflow's own files (CI-13), skip the builds and tests
  # (scripts/ci_scope.py, docs/develop/testing.md#documentation-only-pull-requests).
  scope:
    runs-on: ubuntu-latest
    # Reads this workflow's earlier runs, and the main commit each tested
    # against (its scope job's notice), to carry a passed result forward
    # (CI-53).
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
      full: ${{ steps.scope.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python3 scripts/ci_scope.py --workflow au --github-output "$GITHUB_OUTPUT"
      - name: 'Full run: later pushes compare with this commit'
        if: steps.scope.outputs.proving == 'true'
        run: echo "Every job of this workflow runs, on every platform (CI-53)."

  # CI-7: the newest SDK release is resolved once per run, here, and every
  # job below builds exactly that release from this lock file, so the jobs
  # of one run cannot build against different releases.
  sdk:
    needs: scope
    # The Audio Unit builds only on macOS, so a draft skips it (CI-54).
    if: needs.scope.outputs.build == 'true' && needs.scope.outputs.full == 'true'
    name: Newest AudioUnitSDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Resolve and record it
        run: |
          mkdir -p "$RUNNER_TEMP/lock"
          python3 scripts/release/resolve.py dependencies --cache "$RUNNER_TEMP/downloads" \
            --lock "$RUNNER_TEMP/lock/audiounitsdk-lock.json" audiounitsdk
      - uses: actions/upload-artifact@v7
        with:
          name: audiounitsdk-lock
          path: ${{ runner.temp }}/lock/audiounitsdk-lock.json
          if-no-files-found: error
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python3 scripts/release/resolve.py explain-failure --suspect audiounitsdk
  au:
    # Skipped with the sdk job when the scope job finds nothing to build.
    needs: sdk
    # A fixed image label: the newest generally available macOS image
    # (docs/develop/build.md#compilers-and-ci-machines). GitHub still updates
    # its Xcode and macOS point releases, so the versions are logged for each
    # run.
    runs-on: macos-26
    # The Release build and both sanitizer builds, one after the other (CI-51).
    timeout-minutes: 45
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      # Builds and tests use every CPU the runner has.
      - uses: ./.github/actions/use-every-cpu
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v8
        with:
          name: audiounitsdk-lock
          path: ${{ runner.temp }}/lock
      # Resolved once by the sdk job (CI-7).
      - name: Newest AudioUnitSDK
        run: >-
          python scripts/release/sources.py --lock "$RUNNER_TEMP/lock/audiounitsdk-lock.json" --fetch
          --cache "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/sources" audiounitsdk
      # The newest Xcode on this image (docs/develop/build.md#compilers-and-ci-machines).
      - uses: ./.github/actions/newest-compiler
        with:
          compiler: xcode
      # The sanitizer builds below run after a Release failure, but not when
      # this setup failed (CI-51): it is reached only after the SDK fetch and
      # the compiler step succeeded.
      - name: Tools and libraries
        id: setup
        run: |
          sw_vers
          xcodebuild -version
          brew install libsndfile
      # Compiler cache: pull requests restore it; main and manual runs also
      # save it (docs/develop/testing.md#compiler-cache).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@e91f31892a1d1b8c44424b1a94c0b7f52d337168  # v1.2.26
        with:
          key: au-macos-26
          # Three configurations: Release, ASan and UBSan, ThreadSanitizer (CI-51).
          max-size: 2G
          save: ${{ github.event_name != 'pull_request' }}
      # AUTO selects Accelerate for plug-in builds on macOS; libsndfile is only
      # for the CLI and the tests, never linked into the component, which reads
      # filter files with AudioToolbox (au.bundle checks its libraries).
      - name: Configure
        run: >-
          cmake -S . -B build-au -DCMAKE_BUILD_TYPE=Release -DCONVOLVER_BUILD_AU=ON
          "-DCONVOLVER_AU_SDK=$RUNNER_TEMP/sources/AudioUnitSDK" -DCONVOLVER_LEGACY_TESTS=OFF
      - name: Build the component, CLI and tests
        run: cmake --build build-au
      - name: Core, CLI, AU adapter and PLUG-2 harness
        # The repository checks and package consumers run in the native jobs
        # (docs/develop/testing.md#which-configurations-run-which-tests).
        run: >-
          ctest --test-dir build-au --output-on-failure --output-junit junit.xml
          -LE 'repository|consumer'
      # CTest shows the timing tests' output only when they fail: print the
      # tables and the summary from its log, also when they passed or were
      # skipped as not qualified (docs/develop/testing.md#load-timing-perf-9).
      - name: Load timings
        if: always()
        shell: bash
        run: >-
          sed -n '/load timing (/,/load timing: /p'
          build-au/Testing/Temporary/LastTest.log || true
      # PERF-13: every callback's record, with the build and machine.
      - name: Keep the load-timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-timing-${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: build-au/*-load-timing/*-load-timing.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Install for this user
        run: |
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          ditto build-au/plugins/au/Convolver.component "$components/Convolver.component"
          # Make the component registrar rescan, as after an installer.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i conv || true
      # AU-6: auval also lists and loads Convolver's window.
      - name: auval (strict)
        shell: bash  # With pipefail, so auval's own failure still fails the step.
        run: |
          auval -strict -v aufx Conv CONV | tee auval.txt
          grep -q "Cocoa Views Available: 1" auval.txt
      # AU-15, AU-18: Apple's own hosting stack, AVAudioEngine offline rendering,
      # plays the first-use examples through the installed unit with each
      # filter loaded as an .aupreset, and checks them against the oracle;
      # also in GarageBand's order (restored while running, at 44.1 kHz),
      # with Latency chosen while running, and after a ClassInfo round trip.
      - name: AVAudioEngine renders the first-use examples in the hosts' orders
        run: python tests/au/avaudioengine_tests.py build-au/convolver-preset
      # COMPAT-1: the ClassInfo each published preview's Audio Unit saved
      # (tests/upgrade/*/au.json), restored in this build's installed unit
      # through AVAudioEngine; the same latency, and the expected audio
      # within upgrade.cli's bound.
      - name: Restores the published previews' Audio Unit state
        run: |
          xcrun swiftc -O -o "$RUNNER_TEMP/avaudioengine_render" tests/au/avaudioengine_render.swift
          python tests/upgrade/run_upgrade.py --au-render "$RUNNER_TEMP/avaudioengine_render"
      # AU-3: pluginval, a JUCE host, on the installed component, with its
      # editor tests opening the window. The formal check uses the newest
      # full release (CI-6).
      - name: Newest pluginval release
        id: pluginval
        uses: ./.github/actions/pluginval
      - name: pluginval
        env:
          PLUGINVAL: ${{ steps.pluginval.outputs.path }}
          VERSION: ${{ steps.pluginval.outputs.version }}
        run: |
          options=()
          # rtcheck (pluginval 2, macOS) flags real-time-unsafe calls while processing.
          if [ "${VERSION%%.*}" -ge 2 ]; then options+=(--rtcheck relaxed); fi
          python tests/plugins/pluginval.py validate "$PLUGINVAL" \
            "$HOME/Library/Audio/Plug-Ins/Components/Convolver.component" "${options[@]}"
      # A newer beta or release candidate only signposts what is coming:
      # what it reports is a warning, never a failure. Pushes to main, the
      # weekly and manual runs check it; pull requests do not (CI-38).
      - name: Newest pluginval pre-release
        id: pluginval-prerelease
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/pluginval
        with:
          prerelease: 'true'
      - name: pluginval pre-release (advisory)
        if: always() && steps.pluginval.outcome == 'success' && github.event_name != 'pull_request'
        env:
          FETCHED: ${{ steps.pluginval-prerelease.outcome }}
          AVAILABLE: ${{ steps.pluginval-prerelease.outputs.available }}
          PLUGINVAL: ${{ steps.pluginval-prerelease.outputs.path }}
          VERSION: ${{ steps.pluginval-prerelease.outputs.version }}
          RELEASE: ${{ steps.pluginval.outputs.version }}
        run: |
          advise() {
            echo "::warning title=pluginval pre-release::$1"
            echo "**Warning:** $1" >> "$GITHUB_STEP_SUMMARY"
          }
          component="$HOME/Library/Audio/Plug-Ins/Components/Convolver.component"
          if [ "$FETCHED" != success ]; then
            advise 'Cannot fetch the newest pluginval pre-release; see the log of the step before.'
          elif [ "$AVAILABLE" = true ]; then
            options=()
            if [ "${VERSION%%.*}" -ge 2 ]; then options+=(--rtcheck relaxed); fi
            if python tests/plugins/pluginval.py validate "$PLUGINVAL" "$component" "${options[@]}"; then
              echo "pluginval $VERSION (pre-release) passes the Audio Unit, as $RELEASE does." \
                >> "$GITHUB_STEP_SUMMARY"
            else
              message="pluginval $VERSION (pre-release) reports Audio Unit problems that $RELEASE does not;"
              advise "$message see the log of this step."
            fi
          fi
      # Two Debug builds of the AU tests follow, each in a folder of its own
      # (CI-51: they were two more macOS jobs, which queued for the account's
      # five macOS runners). They run even when the Release steps above
      # failed, so each part's result shows on its own step. auval cannot load
      # an instrumented bundle, so only the in-process tests run there, and the
      # core's own sanitizer runs are in the native workflow.
      #
      # CONVOLVER_SANITIZERS=ON compiles the adapter, AudioUnitSDK and the AU
      # tests with ASan and UBSan (jrp's review of 0.5.5: they were only linked
      # with the runtimes). That build also uses the fallbacks, libsndfile for
      # the window's filter files and FFTW for the FFT, so they keep working; the
      # Release build above uses the defaults (AudioToolbox and Accelerate) that
      # packages use. FFTW is installed only now, after the Release build.
      # The tests use the unit they register in-process, never an installed
      # one (tests/au/au_host.hpp), but the Release copy goes first anyway,
      # as on the separate machines these builds had before.
      - name: Remove the installed Release component
        if: ${{ !cancelled() }}
        run: |
          rm -rf "$HOME/Library/Audio/Plug-Ins/Components/Convolver.component"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
      - name: FFTW for the fallback build
        id: asan-tools
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: brew install fftw
      - name: Configure the ASan and UBSan build (Debug, fallbacks)
        id: asan-configure
        if: ${{ !cancelled() && steps.asan-tools.outcome == 'success' }}
        run: >-
          cmake -S . -B build-au-asan -DCMAKE_BUILD_TYPE=Debug
          -DCONVOLVER_BUILD_AU=ON "-DCONVOLVER_AU_SDK=$RUNNER_TEMP/sources/AudioUnitSDK"
          -DCONVOLVER_LEGACY_TESTS=OFF -DCONVOLVER_SANITIZERS=ON
          -DCONVOLVER_AU_FILE_READER=LIBSNDFILE -DCONVOLVER_FFT_BACKEND=FFTW
      # Only what the au.* tests run (CI-9).
      - name: Build the ASan and UBSan AU tests
        id: asan-build
        if: ${{ !cancelled() && steps.asan-configure.outcome == 'success' }}
        run: cmake --build build-au-asan --target convolver_au_suite
      # A test renamed away from the selection fails rather than passing unrun.
      - name: AU tests (Debug, ASan and UBSan, fallbacks)
        if: ${{ !cancelled() && steps.asan-build.outcome == 'success' }}
        run: >-
          ctest --test-dir build-au-asan --output-on-failure --output-junit junit.xml
          --no-tests=error -L au
      # AU-3: au.adapter again under ThreadSanitizer, with the defaults the
      # packages use. It switches bypass from another thread while rendering,
      # sets the Latency from audio threads and holds the Latency work's lock
      # while the host changes bypass. ThreadSanitizer cannot be combined with
      # ASan, so it is a build of its own, of that one test.
      - name: Configure the ThreadSanitizer build (Debug)
        id: tsan-configure
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: >-
          cmake -S . -B build-au-tsan -DCMAKE_BUILD_TYPE=Debug
          -DCONVOLVER_BUILD_AU=ON "-DCONVOLVER_AU_SDK=$RUNNER_TEMP/sources/AudioUnitSDK"
          -DCONVOLVER_LEGACY_TESTS=OFF
          -DCMAKE_CXX_FLAGS=-fsanitize=thread
          -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread
          -DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=thread
          -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=thread
      - name: Build the ThreadSanitizer AU adapter tests
        id: tsan-build
        if: ${{ !cancelled() && steps.tsan-configure.outcome == 'success' }}
        run: cmake --build build-au-tsan --target convolver_au_tests
      # A run without the runtime would pass without checking anything.
      - name: Check that the test links ThreadSanitizer
        id: tsan-linked
        if: ${{ !cancelled() && steps.tsan-build.outcome == 'success' }}
        run: |
          test_program=$(find build-au-tsan -type f -perm -u+x -name convolver_au_tests | head -n 1)
          otool -L "$test_program" | tee linked.txt
          grep -q 'libclang_rt.tsan' linked.txt
      - name: AU adapter tests (Debug, ThreadSanitizer)
        if: ${{ !cancelled() && steps.tsan-linked.outcome == 'success' }}
        env:
          # Every race is reported, with both threads' stacks, and any report
          # fails the test at exit (on macOS by aborting).
          TSAN_OPTIONS: halt_on_error=0 second_deadlock_stack=1
        run: >-
          ctest --test-dir build-au-tsan --output-on-failure --output-junit junit.xml
          --no-tests=error -R '^au\.adapter$'
      # A new AudioUnitSDK release can need adapter changes (1.4.0 needed C++23).
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python scripts/release/resolve.py explain-failure --suspect audiounitsdk
      # DIAG-1: a failed run keeps CTest's full output (sanitizer reports and
      # lifecycle reproductions included), JUnit results and build identity.
      - name: Collect test evidence
        if: failure()
        run: python scripts/ci_evidence.py test-evidence build-au build-au-asan build-au-tsan
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-evidence
          retention-days: 14
          if-no-files-found: ignore
      # CI-22: a pass on re-run says so, so the earlier failure stays visible.
      - name: Note a pass on re-run
        if: success() && github.run_attempt != '1'
        uses: ./.github/actions/note-retry
