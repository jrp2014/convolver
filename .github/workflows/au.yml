---
# SPDX-License-Identifier: GPL-2.0-or-later
# The Audio Unit adapter (AU-1, AU-2): built against the AudioUnitSDK pinned
# in the release policy (PLUG-6), tested through the Audio Unit API and the
# shared PLUG-2 harness, then installed for the user and checked by auval.
name: Audio Unit

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only documentation skip the builds and tests
  # (scripts/ci_scope.py, docs/develop/testing.md#documentation-only-pull-requests).
  scope:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --github-output "$GITHUB_OUTPUT"

  au:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    # A fixed image label. GitHub still updates its Xcode and macOS point
    # releases, so the versions are logged for each run.
    runs-on: macos-15
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Pinned AudioUnitSDK (release policy)
        run: >-
          python scripts/release/sources.py --fetch
          --cache "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/sources" audiounitsdk
      - name: Tools and libraries
        run: |
          sw_vers
          xcodebuild -version
          brew install libsndfile
      # Compiler cache: pull requests restore it; main and manual runs also
      # save it (docs/develop/testing.md#compiler-cache).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: au-macos-15
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      # AUTO selects Accelerate for plug-in builds on macOS; libsndfile is only
      # for the CLI and the tests' fixtures, never linked into the component.
      - name: Configure
        run: >-
          cmake -S . -B build-au -DCMAKE_BUILD_TYPE=Release -DCONVOLVER_BUILD_AU=ON
          "-DCONVOLVER_AU_SDK=$RUNNER_TEMP/sources/AudioUnitSDK" -DCONVOLVER_LEGACY_TESTS=OFF
      - name: Build the component, CLI and tests
        run: cmake --build build-au --parallel 3
      - name: Core, CLI, AU adapter and PLUG-2 harness
        run: ctest --test-dir build-au --output-on-failure --parallel 3
      - name: Install for this user
        run: |
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          ditto build-au/plugins/au/Convolver.component "$components/Convolver.component"
          # Make the component registrar rescan, as after an installer.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i conv || true
      - name: auval (strict)
        run: auval -strict -v aufx Conv CONV
