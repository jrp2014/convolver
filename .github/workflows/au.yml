---
# SPDX-License-Identifier: GPL-2.0-or-later
# The Audio Unit adapter (AU-1, AU-2): built against the newest AudioUnitSDK
# release (CI-6; its version, commit and checksum are in the job summary),
# tested through the Audio Unit API and the shared PLUG-2 harness, then
# installed for the user and checked by auval.
name: Audio Unit

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Each Monday, so that a new AudioUnitSDK release shows up within a week
  # even when nothing here changes (CI-6).
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only documentation, or only another plug-in
  # format's or workflow's own files (CI-13), skip the builds and tests
  # (scripts/ci_scope.py, docs/develop/testing.md#documentation-only-pull-requests).
  scope:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --workflow au --github-output "$GITHUB_OUTPUT"

  au:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    # A fixed image label. GitHub still updates its Xcode and macOS point
    # releases, so the versions are logged for each run.
    runs-on: macos-15
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      # Builds and tests use every CPU the runner has.
      - uses: ./.github/actions/use-every-cpu
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Newest AudioUnitSDK
        run: >-
          python scripts/release/sources.py --latest --fetch
          --cache "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/sources" audiounitsdk
      - name: Tools and libraries
        run: |
          sw_vers
          xcodebuild -version
          brew install libsndfile
      # Compiler cache: pull requests restore it; main and manual runs also
      # save it (docs/develop/testing.md#compiler-cache).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: au-macos-15
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      # AUTO selects Accelerate for plug-in builds on macOS; libsndfile is only
      # for the CLI and the tests, never linked into the component, which reads
      # filter files with AudioToolbox (au.bundle checks its libraries).
      - name: Configure
        run: >-
          cmake -S . -B build-au -DCMAKE_BUILD_TYPE=Release -DCONVOLVER_BUILD_AU=ON
          "-DCONVOLVER_AU_SDK=$RUNNER_TEMP/sources/AudioUnitSDK" -DCONVOLVER_LEGACY_TESTS=OFF
      - name: Build the component, CLI and tests
        run: cmake --build build-au
      - name: Core, CLI, AU adapter and PLUG-2 harness
        # The repository checks and package consumers run in the native jobs
        # (docs/develop/testing.md#which-configurations-run-which-tests).
        run: >-
          ctest --test-dir build-au --output-on-failure --output-junit junit.xml
          -LE 'repository|consumer'
      - name: Install for this user
        run: |
          components="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$components"
          ditto build-au/plugins/au/Convolver.component "$components/Convolver.component"
          # Make the component registrar rescan, as after an installer.
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -a | grep -i conv || true
      # AU-6: auval also lists and loads Convolver's window.
      - name: auval (strict)
        shell: bash  # With pipefail, so auval's own failure still fails the step.
        run: |
          auval -strict -v aufx Conv CONV | tee auval.txt
          grep -q "Cocoa Views Available: 1" auval.txt
      # A new AudioUnitSDK release can need adapter changes (1.4.0 needed C++23).
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python scripts/release/resolve.py explain-failure --suspect audiounitsdk
      # DIAG-1: a failed run keeps CTest's full output (sanitizer reports and
      # lifecycle reproductions included), JUnit results and build identity.
      - name: Collect test evidence
        if: failure()
        run: python scripts/ci_evidence.py test-evidence build-au
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: test-evidence
          retention-days: 14
          if-no-files-found: ignore

  # CONVOLVER_SANITIZERS=ON compiles the adapter, AudioUnitSDK and the AU
  # tests with ASan and UBSan (jrp's review of 0.5.5: they were only linked
  # with the runtimes). Only the AU tests run here: the core's sanitizer runs
  # are in the native workflow, and auval cannot load an instrumented bundle.
  au-sanitizers:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: macos-15
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      # Builds and tests use every CPU the runner has.
      - uses: ./.github/actions/use-every-cpu
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Newest AudioUnitSDK
        run: >-
          python scripts/release/sources.py --latest --fetch
          --cache "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/sources" audiounitsdk
      - name: Tools and libraries
        run: brew install libsndfile
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: au-sanitizers-macos-15
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      - name: Configure
        run: >-
          cmake -S . -B build-au -DCMAKE_BUILD_TYPE=Debug -DCONVOLVER_SANITIZERS=ON
          -DCONVOLVER_BUILD_AU=ON "-DCONVOLVER_AU_SDK=$RUNNER_TEMP/sources/AudioUnitSDK"
          -DCONVOLVER_LEGACY_TESTS=OFF
      # Only what the au.* tests run (CI-9).
      - name: Build
        run: cmake --build build-au --target convolver_au_suite
      - name: AU adapter, harness and lifecycle under ASan and UBSan
        run: ctest --test-dir build-au --output-on-failure --output-junit junit.xml -L au
      - name: Collect test evidence
        if: failure()
        run: python scripts/ci_evidence.py test-evidence build-au
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: test-evidence
          retention-days: 14
          if-no-files-found: ignore
