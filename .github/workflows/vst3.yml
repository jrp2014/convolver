---
# SPDX-License-Identifier: GPL-2.0-or-later
name: VST3 compatibility
'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  vst3:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # AUTO is what plug-in builds ship (Ooura, Accelerate on macOS);
        # the FFTW job keeps the explicit override working.
        fft: [AUTO]
        include:
          - os: ubuntu-latest
            fft: FFTW
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: steinbergmedia/vst3sdk
          ref: 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96  # SDK 3.8.1 build 84
          path: build-sdk
          submodules: false
      - name: SDK dependencies
        working-directory: build-sdk
        run: git submodule update --init --depth 1 base cmake pluginterfaces public.sdk
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libsndfile1-dev xvfb libasound2t64
      - name: macOS libraries
        if: runner.os == 'macOS'
        run: brew install fftw libsndfile
      - name: Prepare vcpkg binary cache
        id: vcpkg-cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;default,readwrite" >> $env:GITHUB_ENV
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the vcpkg revision' }
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Cache vcpkg binary archives
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: >-
            ${{ format('vcpkg-v1-{0}-{1}-x64-windows-static-md--{2}-{3}-{4}',
            runner.os, runner.arch, steps.vcpkg-cache.outputs.image,
            steps.vcpkg-cache.outputs.revision, hashFiles('.github/workflows/vst3.yml')) }}
          restore-keys: |
            vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-md--
      - name: Windows libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install fftw3:x64-windows-static-md 'libsndfile[core]:x64-windows-static-md'
      - name: Download pluginval
        shell: bash
        env:
          PLUGINVAL_TAG: v2.0.0-beta3
        run: |
          case "$RUNNER_OS" in
            Linux) archive=pluginval_Linux.zip; executable=pluginval
              sha=2e23d311c8c2664457b11be8f6cf4ed29cfdc08765c71c43934a1ed3360f118f ;;
            macOS) archive=pluginval_macOS.zip; executable=pluginval.app/Contents/MacOS/pluginval
              sha=d13c260110e9a1d375e9130e79d20439dcdc9f7d0cfcad74a29197dd78d84ac3 ;;
            Windows) archive=pluginval_Windows.zip; executable=pluginval.exe
              sha=da158e918b60430c6a5223cd99cc2e746bda604e583258c400898caf4e95c523 ;;
          esac
          directory="$RUNNER_TEMP/pluginval"
          mkdir -p "$directory"
          curl -fsSL --retry 3 -o "$directory/$archive" \
            "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_TAG/$archive"
          python - "$directory/$archive" "$sha" <<'EOF'
          import hashlib, sys
          digest = hashlib.sha256(open(sys.argv[1], 'rb').read()).hexdigest()
          sys.exit(digest != sys.argv[2] and f'unexpected pluginval checksum {digest}')
          EOF
          (cd "$directory" && unzip -q "$archive")
          echo "PLUGINVAL=$directory/$executable" >> "$GITHUB_ENV"
          # rtcheck (macOS only) flags real-time-unsafe calls during processing.
          if [ "$RUNNER_OS" = macOS ]; then
            echo "PLUGINVAL_ARGS=--rtcheck;relaxed" >> "$GITHUB_ENV"
          fi
      - name: Configure Unix
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build-vst3 -DCMAKE_BUILD_TYPE=Release -DCONVOLVER_BUILD_VST3=ON
          "-DCONVOLVER_FFT_BACKEND=${{ matrix.fft }}"
          "-DCONVOLVER_VST3_SDK=${{ github.workspace }}/build-sdk" -DCONVOLVER_LEGACY_TESTS=OFF
          "-DCONVOLVER_PLUGINVAL=$PLUGINVAL" "-DCONVOLVER_PLUGINVAL_ARGS=$PLUGINVAL_ARGS"
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build-vst3 -A x64 -DCONVOLVER_BUILD_VST3=ON
          "-DCONVOLVER_VST3_SDK=${{ github.workspace }}/build-sdk"
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DCONVOLVER_LEGACY_TESTS=OFF
          "-DCONVOLVER_PLUGINVAL=$env:PLUGINVAL"
      - name: Build actual plugin, preset tool and SDK validator
        run: cmake --build build-vst3 --config Release --parallel 2
      - name: Core, host, preset, VST3 validator and pluginval
        run: ctest --test-dir build-vst3 -C Release --output-on-failure --parallel 2
