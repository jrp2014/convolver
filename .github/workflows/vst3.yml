---
# SPDX-License-Identifier: GPL-2.0-or-later
name: VST3 compatibility
'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Each Monday, so that a new upstream release of an SDK or tool shows up
  # within a week even when nothing here changes (CI-6).
  schedule:
    - cron: '23 6 * * 1'
permissions:
  contents: read
# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  # Pull requests that change only documentation, or only another plug-in
  # format's or workflow's own files (CI-13), skip the builds and tests
  # (scripts/ci_scope.py, docs/develop/testing.md#documentation-only-pull-requests).
  scope:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --workflow vst3 --github-output "$GITHUB_OUTPUT"
  # CI-7: the newest SDK release is resolved once per run, here, and every
  # job below builds exactly that release from this lock file, so the jobs
  # of one run cannot build against different releases.
  sdk:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    name: Newest VST3 SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Resolve and record it
        run: |
          mkdir -p "$RUNNER_TEMP/lock"
          python3 scripts/release/resolve.py dependencies --cache "$RUNNER_TEMP/downloads" \
            --lock "$RUNNER_TEMP/lock/vst3-sdk-lock.json" \
            vst3sdk vst3-base vst3-cmake vst3-pluginterfaces vst3-public-sdk
      - uses: actions/upload-artifact@v7
        with:
          name: vst3-sdk-lock
          path: ${{ runner.temp }}/lock/vst3-sdk-lock.json
          if-no-files-found: error
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python3 scripts/release/resolve.py explain-failure
  vst3:
    # Skipped with the sdk job when the scope job finds nothing to build.
    needs: sdk
    name: vst3 (${{ matrix.os }}, ${{ matrix.fft }})
    strategy:
      fail-fast: false
      matrix:
        # AUTO is what plug-in builds ship (Ooura, Accelerate on macOS);
        # the sanitizer job below builds the explicit FFTW override and runs
        # its in-process tests (no job loads an FFTW bundle in the validator
        # or pluginval, since FFTW plug-ins are not distributed).
        # The core suite runs here only where no other job builds the same
        # compiler, flags and backend: on Linux the native g++ jobs do,
        # so this one runs the VST3 tests alone. macos-latest has a newer
        # Xcode than the Audio Unit job's macos-15, so it keeps the suite
        # (docs/develop/testing.md#which-configurations-run-which-tests).
        # A job that runs only the VST3 tests builds only what they run (CI-9).
        include:
          - os: ubuntu-latest
            fft: AUTO
            tests: -L vst3
            targets: --target convolver_vst3_suite
          - os: macos-latest
            fft: AUTO
            tests: -LE 'repository|consumer'
          - os: windows-latest
            fft: AUTO
            tests: -LE 'repository|consumer'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # Builds and tests use every CPU the runner has.
      - uses: ./.github/actions/use-every-cpu
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: vst3-sdk-lock
          path: ${{ runner.temp }}/lock
      # CI-6: the newest SDK release and its four submodules (resolved once
      # by the sdk job, CI-7), recorded in the job summary (version, tag,
      # commits and archive checksums).
      - name: Newest VST3 SDK
        id: sdk
        shell: bash
        run: >-
          python scripts/release/sources.py --lock "$RUNNER_TEMP/lock/vst3-sdk-lock.json" --fetch
          --cache "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/sources"
          --github-output "$GITHUB_OUTPUT"
          vst3sdk vst3-base vst3-cmake vst3-pluginterfaces vst3-public-sdk
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libsndfile1-dev xvfb libasound2t64
      - name: macOS libraries
        if: runner.os == 'macOS'
        run: brew install fftw libsndfile
      - name: Prepare vcpkg binary cache
        id: vcpkg-cache
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-binary-cache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "VCPKG_BINARY_SOURCES=clear;default,readwrite" >> $env:GITHUB_ENV
          # CI-22: as it exits, vcpkg's metrics upload copies vcpkg.exe with
          # no sharing, so a parallel build's app-local DLL step (z-applocal)
          # sometimes cannot start it: "being used by another process", exit
          # 32 (microsoft/vcpkg-tool#2163, fixed upstream 28 October 2026).
          "VCPKG_DISABLE_METRICS=1" >> $env:GITHUB_ENV
          $revision = git -C $env:VCPKG_INSTALLATION_ROOT rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot identify the vcpkg revision' }
          "revision=$revision" >> $env:GITHUB_OUTPUT
          "image=$env:ImageVersion" >> $env:GITHUB_OUTPUT
      - name: Cache vcpkg binary archives
        if: runner.os == 'Windows'
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: >-
            ${{ format('vcpkg-v1-{0}-{1}-x64-windows-static-md--{2}-{3}-{4}',
            runner.os, runner.arch, steps.vcpkg-cache.outputs.image,
            steps.vcpkg-cache.outputs.revision, hashFiles('.github/workflows/vst3.yml')) }}
          restore-keys: |
            vcpkg-v1-${{ runner.os }}-${{ runner.arch }}-x64-windows-static-md--
      - name: Windows libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install fftw3:x64-windows-static-md 'libsndfile[core]:x64-windows-static-md'
      # CI-6: the formal tests use the newest full pluginval release (not a
      # beta); the summary records its version and checksum, checked against
      # GitHub's published digest where there is one.
      - name: Newest pluginval release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS" in
            Linux) executable=pluginval ;;
            macOS) executable=pluginval.app/Contents/MacOS/pluginval ;;
            Windows) executable=pluginval.exe ;;
          esac
          echo "PLUGINVAL_EXECUTABLE=$executable" >> "$GITHUB_ENV"
          directory="$RUNNER_TEMP/pluginval"
          python scripts/release/resolve.py tool pluginval --cache "$directory" --os "$RUNNER_OS" \
            --github-output "$RUNNER_TEMP/pluginval.env"
          archive=$(sed -n 's/^archive=//p' "$RUNNER_TEMP/pluginval.env")
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/pluginval.env")
          (cd "$directory" && unzip -q "$archive")
          echo "PLUGINVAL=$directory/$executable" >> "$GITHUB_ENV"
          echo "PLUGINVAL_VERSION=$version" >> "$GITHUB_ENV"
          # rtcheck (pluginval 2, macOS only) flags real-time-unsafe calls
          # during processing.
          if [ "$RUNNER_OS" = macOS ] && [ "${version%%.*}" -ge 2 ]; then
            echo "PLUGINVAL_ARGS=--rtcheck;relaxed" >> "$GITHUB_ENV"
          fi
      # Compiler cache: pull requests restore it; main and manual runs also
      # save it (docs/develop/testing.md#compiler-cache).
      - name: Compiler cache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607  # v1.2.25
        with:
          key: vst3-${{ matrix.os }}-${{ matrix.fft }}
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      - name: Configure Unix
        if: runner.os != 'Windows'
        run: >-
          cmake -S . -B build-vst3 -DCMAKE_BUILD_TYPE=Release -DCONVOLVER_BUILD_VST3=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          "-DCONVOLVER_FFT_BACKEND=${{ matrix.fft }}"
          "-DCONVOLVER_VST3_SDK=${{ steps.sdk.outputs.vst3sdk }}" -DCONVOLVER_LEGACY_TESTS=OFF
          "-DCONVOLVER_PLUGINVAL=$PLUGINVAL" "-DCONVOLVER_PLUGINVAL_ARGS=$PLUGINVAL_ARGS"
      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          cmake -S . -B build-vst3 -A x64 -DCONVOLVER_BUILD_VST3=ON
          "-DCONVOLVER_VST3_SDK=${{ steps.sdk.outputs.vst3sdk }}"
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md -DCONVOLVER_LEGACY_TESTS=OFF
          "-DCONVOLVER_PLUGINVAL=$env:PLUGINVAL"
      - name: Build actual plugin, preset tool and SDK validator
        run: cmake --build build-vst3 --config Release ${{ matrix.targets }}
      - name: VST3 validator, pluginval and the VST3 tests
        run: >-
          ctest --test-dir build-vst3 -C Release --output-on-failure --output-junit junit.xml
          ${{ matrix.tests }}
      # CTest shows the timing tests' output only when they fail: print the
      # tables and the summary from its log, also when they passed or were
      # skipped as not qualified (docs/develop/testing.md#load-timing-perf-9).
      - name: Load timings
        if: always()
        shell: bash
        run: >-
          sed -n '/load timing (/,/load timing: /p'
          build-vst3/Testing/Temporary/LastTest.log || true
      # PERF-13: every callback's record, with the build and machine.
      - name: Keep the load-timing records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: load-timing-${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: build-vst3/*-load-timing/*-load-timing.json
          retention-days: 14
          if-no-files-found: ignore
      # VST3-12: the Windows window as vst3.editor drew it, with a filter
      # playing and with one refused (docs/develop/testing.md#vst3-tests).
      - name: Keep the window's pictures
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: vst3-window-windows-attempt-${{ github.run_attempt }}
          path: build-vst3/plugins/vst3/vst3-editor*.bmp
          retention-days: 14
          if-no-files-found: ignore
      # The newest pluginval beta or release candidate, when one is newer than
      # the release above: what it reports is a warning in the summary, not a
      # failure, since a pre-release only signposts what is coming. The one
      # exception is the acceptance test, which needs pluginval 2's `test`
      # command that no full release has yet (docs/develop/testing.md#pluginval).
      - name: Newest pluginval pre-release (advisory)
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Problems here are warnings, except that the acceptance test must
          # pass while the formal release (pluginval 1) cannot run it.
          required=false
          if [ "${PLUGINVAL_VERSION%%.*}" -lt 2 ]; then required=true; fi
          advise() {
            echo "::warning title=pluginval pre-release::$1"
            echo "**Warning:** $1" >> "$GITHUB_STEP_SUMMARY"
          }
          # CI-8: the job stays green, so keep what a run that reports
          # problems left behind (CTest's log of it), for the step below.
          kept=0
          keep_evidence() {
            kept=$((kept + 1))
            python scripts/ci_evidence.py --advisory "advisory-evidence/$kept-$1" build-vst3 ||
              echo "::warning::Could not collect the advisory run's evidence."
            echo 'ADVISORY_EVIDENCE=true' >> "$GITHUB_ENV"
          }
          give_up() {
            if [ "$required" = true ]; then
              echo "::error title=pluginval pre-release::$1 The acceptance test needs it (pluginval 2)."
              exit 1
            fi
            advise "$1"
            exit 0
          }
          directory="$RUNNER_TEMP/pluginval-prerelease"
          python scripts/release/resolve.py tool pluginval --prerelease --cache "$directory" \
            --os "$RUNNER_OS" --github-output "$RUNNER_TEMP/pluginval-prerelease.env" ||
            give_up "Cannot fetch the newest pluginval pre-release; see the log of this step."
          if ! grep -qx 'available=true' "$RUNNER_TEMP/pluginval-prerelease.env"; then
            # No newer pre-release: the formal release must then run the acceptance test itself.
            if [ "$required" = true ]; then
              echo "::error::No pluginval 2 to run the acceptance test with."
              exit 1
            fi
            exit 0
          fi
          archive=$(sed -n 's/^archive=//p' "$RUNNER_TEMP/pluginval-prerelease.env")
          version=$(sed -n 's/^version=//p' "$RUNNER_TEMP/pluginval-prerelease.env")
          if [ "${version%%.*}" -lt 2 ]; then
            required=false  # It could not run the acceptance test either.
            advise "pluginval $version cannot run the acceptance test (it needs pluginval 2)."
          fi
          (cd "$directory" && unzip -q "$archive") ||
            give_up "Cannot unpack pluginval $version; see the log of this step."
          arguments=''
          if [ "$RUNNER_OS" = macOS ]; then arguments='--rtcheck;relaxed'; fi
          cmake -S . -B build-vst3 "-DCONVOLVER_PLUGINVAL=$directory/$PLUGINVAL_EXECUTABLE" \
            "-DCONVOLVER_PLUGINVAL_ARGS=$arguments" ||
            give_up "Cannot configure the tests with pluginval $version; see the log of this step."
          if ctest --test-dir build-vst3 -C Release --output-on-failure --no-tests=error \
            -R '^vst3\.pluginval$' --output-junit advisory-junit.xml; then
            echo "pluginval $version (pre-release): validation passes, as with $PLUGINVAL_VERSION." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            message="pluginval $version (pre-release) reports problems that $PLUGINVAL_VERSION does not;"
            advise "$message see the log of this step. The formal result is $PLUGINVAL_VERSION's."
            keep_evidence validation
          fi
          if [ "$required" = true ]; then
            # A skip (exit code 77) would pass silently, so it is refused.
            ctest --test-dir build-vst3 -C Release --output-on-failure --no-tests=error \
              -R '^vst3\.pluginval\.acceptance$' --output-junit "$RUNNER_TEMP/acceptance.xml"
            if grep -q '<skipped' "$RUNNER_TEMP/acceptance.xml"; then
              echo "::error::The acceptance test was skipped with pluginval $version."
              exit 1
            fi
          elif [ "${version%%.*}" -ge 2 ] && ! ctest --test-dir build-vst3 -C Release --output-on-failure \
            --no-tests=error -R '^vst3\.pluginval\.acceptance$' --output-junit advisory-junit.xml; then
            advise "The acceptance test fails with pluginval $version (pre-release); see the log of this step."
            keep_evidence acceptance
          fi
      - name: Keep advisory evidence
        if: always() && env.ADVISORY_EVIDENCE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: advisory-evidence-${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: advisory-evidence
          retention-days: 14
          if-no-files-found: ignore
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        shell: bash
        run: python scripts/release/resolve.py explain-failure
      # DIAG-1: a failed run keeps CTest's full output (sanitizer reports and
      # lifecycle reproductions included), JUnit results and build identity.
      - name: Collect test evidence
        if: failure()
        run: python scripts/ci_evidence.py test-evidence build-vst3
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-evidence
          retention-days: 14
          if-no-files-found: ignore
      # CI-22: a pass on re-run says so, so the earlier failure stays visible.
      - name: Note a pass on re-run
        if: success() && github.run_attempt != '1'
        uses: ./.github/actions/note-retry

  # CI-36: the VST3 tests in Debug builds with sanitizers, as the Audio Unit
  # and LV2 workflows run theirs. The SDK's tools and pluginval are not
  # instrumented, so they cannot load an instrumented bundle: the jobs above
  # run them on Release builds. Clang, as in the native sanitizer job, which
  # runs the core suite, so these run only VST3 tests; each entry builds
  # just what its tests run.
  sanitizers:
    # Skipped with the sdk job when the scope job finds nothing to build.
    needs: sdk
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every vst3.* test the build can run, with FFTW, which keeps the
          # explicit override working (the shipped plug-ins use Ooura). The
          # adapter and its tests are instrumented, and the bundle links the
          # instrumented core (docs/develop/build.md, CONVOLVER_SANITIZERS).
          - name: VST3 tests (Debug, ASan and UBSan, FFTW)
            configure: -DCONVOLVER_SANITIZERS=ON -DCONVOLVER_FFT_BACKEND=FFTW
            targets: convolver_vst3_suite
            tests: -L vst3
            cache: vst3-asan-ubuntu-latest
            tsan: false
          # The processor replaced while process() holds it, and the messages
          # between processor and controller: the adapter tests again under
          # ThreadSanitizer, with the shipped backend. Everything, the SDK
          # included, is instrumented, so the SDK's tools are not built.
          - name: VST3 adapter tests (Debug, ThreadSanitizer)
            configure: >-
              -DCONVOLVER_VST3_RUNTIME_VALIDATION=OFF -DCMAKE_CXX_FLAGS=-fsanitize=thread
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=thread
            targets: convolver_vst3_tests
            tests: -R '^vst3\.adapter$'
            cache: vst3-tsan-ubuntu-latest
            tsan: true
    env:
      # Every race is reported, with both threads' stacks, and any report
      # fails the test when it exits.
      TSAN_OPTIONS: halt_on_error=0 second_deadlock_stack=1
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      # Builds and tests use every CPU the runner has.
      - uses: ./.github/actions/use-every-cpu
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: vst3-sdk-lock
          path: ${{ runner.temp }}/lock
      # Resolved once by the sdk job (CI-7).
      - name: Newest VST3 SDK
        id: sdk
        run: >-
          python scripts/release/sources.py --lock "$RUNNER_TEMP/lock/vst3-sdk-lock.json" --fetch
          --cache "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/sources"
          --github-output "$GITHUB_OUTPUT"
          vst3sdk vst3-base vst3-cmake vst3-pluginterfaces vst3-public-sdk
      - name: Linux libraries
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libsndfile1-dev
      # Compiler cache: pull requests restore it; main and manual runs also
      # save it (docs/develop/testing.md#compiler-cache).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607  # v1.2.25
        with:
          key: ${{ matrix.cache }}
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      # ThreadSanitizer cannot map its shadow memory with the kernel's default
      # address-space randomisation on this image, so it is reduced first.
      - name: Reduce address-space randomisation
        if: matrix.tsan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build-vst3 -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug -DCONVOLVER_BUILD_VST3=ON
          "-DCONVOLVER_VST3_SDK=${{ steps.sdk.outputs.vst3sdk }}" -DCONVOLVER_LEGACY_TESTS=OFF
          ${{ matrix.configure }}
      - name: Build
        run: cmake --build build-vst3 --target ${{ matrix.targets }}
      # A run without instrumentation would pass without checking anything:
      # the program must link the runtime (Clang links it statically, so that
      # alone proves little) and the adapter's own code must call into it.
      - name: Check that the test is instrumented for ThreadSanitizer
        if: matrix.tsan
        run: |
          test_program=$(find build-vst3 -type f -perm -u+x -name convolver_vst3_tests | head -n 1)
          test -n "$test_program"
          nm "$test_program" | grep -c '__tsan_func_entry'
          object=$(find build-vst3 -path '*convolver_vst3_tests.dir*' -name 'processor.cpp.o' | head -n 1)
          test -n "$object"
          nm "$object" | grep -c ' U __tsan_func_entry'
      # A test renamed away from the selection fails rather than passing unrun.
      - name: Test
        run: >-
          ctest --test-dir build-vst3 --output-on-failure --output-junit junit.xml
          --no-tests=error ${{ matrix.tests }}
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python scripts/release/resolve.py explain-failure
      # DIAG-1: a failed run keeps CTest's full output (sanitizer reports and
      # lifecycle reproductions included), JUnit results and build identity.
      - name: Collect test evidence
        if: failure()
        run: python scripts/ci_evidence.py test-evidence build-vst3
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.job }}-${{ strategy.job-index }}-attempt-${{ github.run_attempt }}
          path: test-evidence
          retention-days: 14
          if-no-files-found: ignore
      # CI-22: a pass on re-run says so, so the earlier failure stays visible.
      - name: Note a pass on re-run
        if: success() && github.run_attempt != '1'
        uses: ./.github/actions/note-retry
