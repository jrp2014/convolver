---
# SPDX-License-Identifier: GPL-2.0-or-later
# LV2 build and test tools, each the newest release (CI-6), and Convolver's
# LV2 plug-ins (LV2-1). Three jobs run side by side. The first proves the
# tools: the newest lv2 headers build LV2's example plug-ins, lilv loads and
# runs one on a shared fixture, and lv2lint checks it; it then builds
# Convolver's Release bundle and lv2lints every plug-in. The other two build
# against the same packages and run the LV2 tests (lilv-hosted PLUG-2
# harness and adapter tests) under ASan and UBSan, and the adapter tests again
# under ThreadSanitizer (LV2-2's worker). LV2-3 adds pluginval. Each job
# records the versions it used in its summary.
# (lv2apply cannot host Convolver: it offers no features, and Convolver needs
# urid:map for its state.)
name: LV2

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Each Monday, so that a new upstream release of a tool or library shows up
  # within a week even when nothing here changes (CI-6).
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

# lilv and its libraries (serd, sord, sratom, zix) and the lv2 headers come
# from the runner image's Ubuntu packages, the newest that Ubuntu 24.04 and its
# updates offer; each job lists the versions it installed.
env:
  LV2_PACKAGES: >-
    lv2-dev liblilv-dev liblilv-0-0 lilv-utils libserd-dev libserd-0-0 libsord-dev libsord-0-0
    libsratom-dev libsratom-0-0 libzix-dev libzix-0-0

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only documentation skip the builds and tests
  # (scripts/ci_scope.py, docs/develop/testing.md#documentation-only-pull-requests).
  scope:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --github-output "$GITHUB_OUTPUT"

  tools:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    name: Newest tools and Release bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: lilv and lv2 packages
        run: |
          read -ra packages <<< "$LV2_PACKAGES"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}" \
            meson ninja-build pkg-config libelf-dev libsndfile1-dev
          lv2info --version
          python scripts/release/resolve.py packages "${packages[@]}"
      - name: Newest lv2 source
        run: >-
          python scripts/release/sources.py --latest --fetch
          --cache "$RUNNER_TEMP/downloads" --destination "$RUNNER_TEMP/sources" lv2
      # plugins=auto skips examples whose libraries are missing (eg-sampler
      # needs libsamplerate); the next step fails if eg-amp was not built.
      - name: Build LV2's example plug-ins against the newest headers
        run: |
          meson setup "$RUNNER_TEMP/lv2-build" "$RUNNER_TEMP/sources/lv2" \
            -Dplugins=auto -Ddocs=disabled -Dtests=disabled \
            "-Dlv2dir=$RUNNER_TEMP/lv2-bundles" "--prefix=$RUNNER_TEMP/lv2-prefix"
          ninja -C "$RUNNER_TEMP/lv2-build" install
          echo "LV2_PATH=$RUNNER_TEMP/lv2-bundles" >> "$GITHUB_ENV"
          # Convolver's bundle below compiles against these headers too, not
          # the lv2-dev package that lilv brings.
          pc=$(find "$RUNNER_TEMP/lv2-prefix" -name lv2.pc -print -quit)
          test -n "$pc"
          echo "PKG_CONFIG_PATH=$(dirname "$pc")${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      - name: lilv hosts a plug-in on a shared fixture
        run: |
          lv2ls
          output="$RUNNER_TEMP/eg-amp.wav"
          lv2apply -c gain 0 -i examples/first-use/mono/input.wav -o "$output" http://lv2plug.in/plugins/eg-amp
          python - "$output" <<'EOF'
          import sys
          sys.path.insert(0, 'tests/plugins')
          import fixtures
          error = fixtures.worst_error(fixtures.read_float_wav(sys.argv[1]),
                                       fixtures.read_float_wav('examples/first-use/mono/input.wav'))
          print(f'eg-amp at 0 dB, worst difference from its input: {error}')
          sys.exit(error != 0.0)
          EOF
      # The newest lv2lint release. Its own host first, then FreeBSD's
      # distfile cache, over plain HTTP (its HTTPS names have mismatched
      # certificates), accepted only with the checksum FreeBSD's ports
      # publish. When its host does not answer, the newest version FreeBSD's
      # ports know is used, and the summary says so.
      - name: Newest lv2lint
        run: |
          python scripts/release/resolve.py tool lv2lint --cache "$RUNNER_TEMP/lv2lint-download" \
            --github-output "$RUNNER_TEMP/lv2lint.env"
          archive=$(sed -n 's/^archive=//p' "$RUNNER_TEMP/lv2lint.env")
          mkdir "$RUNNER_TEMP/lv2lint"
          tar -xJf "$archive" -C "$RUNNER_TEMP/lv2lint" --strip-components=1
          meson setup "$RUNNER_TEMP/lv2lint-build" "$RUNNER_TEMP/lv2lint" --buildtype=release
          ninja -C "$RUNNER_TEMP/lv2lint-build"
          sudo ninja -C "$RUNNER_TEMP/lv2lint-build" install
      - name: lv2lint checks a plug-in
        # eg-amp lacks lv2:minorVersion and lv2:microVersion, which lv2lint
        # (0.16.2 when this was written) reports as failures. Expect exactly those, so a broken or
        # changed lv2lint is noticed; Convolver's bundle must pass outright.
        run: |
          set +e
          report=$(env -u LV2_PATH lv2lint -I "$LV2_PATH/eg-amp.lv2/" http://lv2plug.in/plugins/eg-amp 2>&1)
          status=$?
          set -e
          echo "$report"
          failures=$(echo "$report" | sed -n 's/^ *\[FAIL\] *//p' | sort | paste -sd ';' -)
          expected='Plugin Version Micro;Plugin Version Minor'
          if [ "$status" -eq 0 ] || [ "$failures" != "$expected" ] ||
             ! echo "$report" | grep -qF '<http://lv2plug.in/plugins/eg-amp>'; then
            echo "Expected lv2lint to fail eg-amp on exactly: $expected (got status $status: $failures)" >&2
            exit 1
          fi
      # lv2lint is not a sanitizer build, so it needs a plain one.
      - name: Convolver's LV2 bundle (Release)
        run: |
          echo "lv2 headers: $(pkg-config --modversion lv2) from $(pkg-config --variable=includedir lv2)"
          cmake -S . -B build-lv2 -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCONVOLVER_BUILD_LV2=ON -DCONVOLVER_BUILD_TESTS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build-lv2 --parallel --target convolver_lv2
          ls -l build-lv2/lv2/convolver.lv2
      - name: clang-tidy on the LV2 adapter
        run: |
          python -m pip install --upgrade clang-tidy
          clang-tidy --version
          clang-tidy -p build-lv2 plugins/lv2/plugin.cpp
      - name: lv2lint checks every Convolver plug-in
        run: |
          bundle="$PWD/build-lv2/lv2/convolver.lv2/"
          uris=$(sed -n 's/^<\(https:[^>]*\)>$/\1/p' "$bundle/manifest.ttl")
          test "$(echo "$uris" | wc -l)" -eq 8
          for uri in $uris; do
            env -u LV2_PATH lv2lint -I "$bundle" "$uri"
          done
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python scripts/release/resolve.py explain-failure

  # The sanitizer builds need only the packages, not the tools job's
  # example plug-ins or lv2lint, so they run beside it. Each builds just the
  # targets its tests run.
  sanitizers:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The tests load the plug-in into lilv in the same process, so a
          # sanitizer build can host a sanitizer build of the plug-in.
          - name: LV2 tests (Debug, ASan and UBSan)
            configure: -DCONVOLVER_SANITIZERS=ON
            targets: convolver_lv2_tests
            tests: '^(examples\.first_use|lv2\..*)$'
            tsan: false
          # The worker's races (LV2-2): the adapter tests again under
          # ThreadSanitizer.
          - name: LV2 adapter tests (Debug, ThreadSanitizer)
            configure: >-
              -DCONVOLVER_LEGACY_TESTS=OFF -DCMAKE_CXX_FLAGS=-fsanitize=thread
              -DCMAKE_EXE_LINKER_FLAGS=-fsanitize=thread -DCMAKE_MODULE_LINKER_FLAGS=-fsanitize=thread
            targets: convolver_lv2_adapter convolver_preset_tool
            tests: '^lv2\.adapter$'
            tsan: true
    env:
      TSAN_OPTIONS: halt_on_error=1
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # The same packages as the tools job.
      - name: lilv and lv2 packages
        run: |
          read -ra packages <<< "$LV2_PACKAGES"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends "${packages[@]}" \
            meson ninja-build pkg-config libelf-dev libsndfile1-dev
          lv2info --version
          python scripts/release/resolve.py packages "${packages[@]}"
      # Compiler cache: pull requests restore it; main and manual runs also
      # save it (docs/develop/testing.md#compiler-cache).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: lv2-${{ matrix.tsan && 'tsan' || 'asan' }}
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      # ThreadSanitizer cannot map its shadow memory with the kernel's default
      # address-space randomisation on this image, so it is reduced first.
      - name: Reduce address-space randomisation
        if: matrix.tsan
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build
        run: |
          cmake -S . -B build-lv2 -G Ninja -DCMAKE_BUILD_TYPE=Debug \
            -DCONVOLVER_BUILD_LV2=ON ${{ matrix.configure }}
          cmake --build build-lv2 --parallel --target ${{ matrix.targets }}
      - name: Test
        run: >-
          ctest --test-dir build-lv2 --output-on-failure --output-junit junit.xml --parallel 2
          -R '${{ matrix.tests }}'
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python scripts/release/resolve.py explain-failure
      # DIAG-1: a failed run keeps CTest's full output (sanitizer reports and
      # lifecycle reproductions included), JUnit results and build identity.
      - name: Collect test evidence
        if: failure()
        run: python scripts/ci_evidence.py test-evidence build-lv2
      - name: Keep test evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-evidence-${{ github.job }}-${{ strategy.job-index }}
          path: test-evidence
          retention-days: 14
          if-no-files-found: ignore

  # The formal tests above use Ubuntu 24.04's lilv packages. This job builds
  # the newest upstream releases of lilv and the libraries under it (zix,
  # serd, sord, sratom, with the newest lv2 headers) and runs the same LV2
  # tests against them, so problems that later packages would bring show up
  # early. It reports them as warnings and never fails the run (CI-6).
  upstream-lilv:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    name: Newest upstream lilv (advisory)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build pkg-config libsndfile1-dev
      - name: Newest upstream sources
        id: sources
        continue-on-error: true
        run: |
          python scripts/release/sources.py --latest --fetch --cache "$RUNNER_TEMP/downloads" \
            --destination "$RUNNER_TEMP/sources" --github-output "$RUNNER_TEMP/upstream.env" lv2
          python scripts/release/resolve.py checkout --destination "$RUNNER_TEMP/upstream" \
            --github-output "$RUNNER_TEMP/upstream.env"
      - name: Build lv2, zix, serd, sord, sratom and lilv
        id: libraries
        if: steps.sources.outcome == 'success'
        continue-on-error: true
        run: |
          prefix="$RUNNER_TEMP/upstream-prefix"
          # Each library is found by the ones built after it, and by Convolver.
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$prefix/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          for name in lv2 zix serd sord sratom lilv; do
            source=$(sed -n "s/^$name=//p" "$RUNNER_TEMP/upstream.env")
            options=(-Ddocs=disabled -Dtests=disabled)
            if [ "$name" = lv2 ]; then options+=(-Dplugins=disabled); fi
            meson setup "$RUNNER_TEMP/upstream-build/$name" "$source" "--prefix=$prefix" --libdir=lib \
              --buildtype=release "${options[@]}"
            ninja -C "$RUNNER_TEMP/upstream-build/$name" install
          done
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
      - name: Convolver's LV2 tests against them
        id: tests
        if: steps.libraries.outcome == 'success'
        continue-on-error: true
        run: |
          echo "lilv $(pkg-config --modversion lilv-0) from $(pkg-config --variable=libdir lilv-0)"
          cmake -S . -B build-upstream -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCONVOLVER_BUILD_LV2=ON \
            -DCONVOLVER_LEGACY_TESTS=OFF
          cmake --build build-upstream --parallel \
            --target convolver_lv2_tests convolver_lv2_adapter convolver_preset_tool
          ctest --test-dir build-upstream --output-on-failure --parallel 2 \
            -R '^(examples\.first_use|lv2\..*)$'
      - name: Report what the newest upstream lilv shows
        if: always()
        env:
          SOURCES: ${{ steps.sources.outcome }}
          LIBRARIES: ${{ steps.libraries.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          if [ "$TESTS" = success ]; then
            echo "Convolver's LV2 tests pass against the newest upstream lilv too." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$SOURCES" != success ]; then
            stage='fetching the newest upstream sources failed'
          elif [ "$LIBRARIES" != success ]; then
            stage='building the newest upstream lilv and its libraries failed'
          else
            stage="Convolver's LV2 build or tests fail against them"
          fi
          message="Newest upstream lilv: $stage; see this job's log."
          message="$message Advisory: the formal LV2 tests use Ubuntu's packages."
          echo "::warning title=Newest upstream lilv::$message"
          echo "**Warning:** $message" >> "$GITHUB_STEP_SUMMARY"
