---
# SPDX-License-Identifier: GPL-2.0-or-later
name: Fuzz smoke tests

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target (manual longer campaigns)
        default: '600'

permissions:
  contents: read

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only documentation skip the builds and tests
  # (scripts/ci_scope.py, docs/develop/testing.md#documentation-only-pull-requests).
  scope:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --github-output "$GITHUB_OUTPUT"

  libfuzzer:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      # Builds and tests use every CPU the runner has.
      - uses: ./.github/actions/use-every-cpu
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libsndfile1-dev clang
      # Compiler cache: pull requests restore it; main and manual runs also
      # save it (docs/develop/testing.md#compiler-cache).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: fuzz-ubuntu-latest
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      - name: Configure Clang libFuzzer with ASan/UBSan
        run: >
          cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
          -DCONVOLVER_SANITIZERS=ON -DCONVOLVER_BUILD_FUZZERS=ON -DCONVOLVER_BUILD_TESTS=OFF
          -DCONVOLVER_LEGACY_TESTS=OFF -DCONVOLVER_DOCUMENTATION_TESTS=OFF
      - name: Build fuzz targets
        run: >
          cmake --build build-fuzz
          --target fuzz_config_text fuzz_config_list fuzz_host_state fuzz_ir_file
      # CI-12: the campaigns run side by side, at most one per physical core,
      # so each keeps a core of its own for its whole time budget: four at once
      # on the runner's 4 CPUs gave each about half its usual executions
      # (docs/develop/testing.md#fuzz-smoke-tests-and-longer-campaigns). The
      # step fails if any campaign does; each log's last lines include its
      # "Done N runs".
      - name: Run each target
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || '60' }}
        run: |
          cores=$(lscpu --parse=CORE,SOCKET | grep -v '^#' | sort -u | wc -l)
          [ "$cores" -ge 1 ] || cores=1
          lscpu | grep -E '^(CPU\(s\)|Thread\(s\) per core|Core\(s\) per socket|Socket\(s\)):' || true
          echo "Running $cores campaigns at a time."
          mkdir -p fuzz-out
          for target in config_text config_list host_state ir_file; do
            while [ "$(jobs -pr | wc -l)" -ge "$cores" ]; do
              wait -n || true
            done
            mkdir -p "fuzz-out/corpus/$target"
            cp tests/fuzz/seeds/$target/* "fuzz-out/corpus/$target/"
            (
              status=0
              ./build-fuzz/fuzz_$target "fuzz-out/corpus/$target" tests/fuzz/regressions/$target \
                -max_total_time="$SECONDS_PER_TARGET" -max_len=65536 -timeout=2 -rss_limit_mb=512 \
                -artifact_prefix="fuzz-out/$target-" > "fuzz-out/$target.log" 2>&1 || status=$?
              echo "$status" > "fuzz-out/$target.status"
            ) &
          done
          wait
          status=0
          for target in config_text config_list host_state ir_file; do
            result=$(cat "fuzz-out/$target.status" 2>/dev/null || echo 'no status')
            echo "== fuzz_$target exited with $result"
            tail -5 "fuzz-out/$target.log"
            [ "$result" = 0 ] || status=1
          done
          exit $status
      - name: Keep crash inputs and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            fuzz-out/*-crash-*
            fuzz-out/*-leak-*
            fuzz-out/*-timeout-*
            fuzz-out/*-oom-*
            fuzz-out/*.log
