---
# SPDX-License-Identifier: GPL-2.0-or-later
name: Fuzz smoke tests

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  # Pull requests run the targets only when they change what the targets are
  # built from (CI-34, scripts/ci_scope.py FUZZED); each Monday a longer
  # campaign runs whatever changed.
  pull_request:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target (manual longer campaigns)
        default: '600'

permissions:
  contents: read

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main, scheduled and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests that change nothing the fuzz targets are built from skip
  # them (CI-34, scripts/ci_scope.py,
  # docs/develop/testing.md#when-pull-requests-run-the-fuzz-targets).
  scope:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --workflow fuzz --github-output "$GITHUB_OUTPUT"

  libfuzzer:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-latest
    # A hang stops after 45 minutes instead of six hours (CI-52). The Monday
    # run's four 600-second campaigns, two at a time, take about 20 minutes
    # after the build; a manual run sets its own length, so keeps GitHub's
    # six-hour limit.
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 360 || 45 }}
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache
    steps:
      - uses: actions/checkout@v7
      # Builds and tests use every CPU the runner has.
      - uses: ./.github/actions/use-every-cpu
      - name: Dependencies
        run: sudo apt-get update && sudo apt-get install -y libfftw3-dev libsndfile1-dev clang llvm
      # The newest compiler on this image (docs/develop/build.md#compilers-and-ci-machines).
      - uses: ./.github/actions/newest-compiler
        with:
          compiler: clang
      # Compiler cache: pull requests restore it; main, scheduled and manual
      # runs also save it (docs/develop/testing.md#compiler-cache).
      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@dbeefd73e8e2ffc1bbc412570072735eb4db3607  # v1.2.25
        with:
          key: fuzz-ubuntu-latest
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}
      - name: Configure Clang libFuzzer with ASan/UBSan
        run: >
          cmake -S . -B build-fuzz -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
          -DCONVOLVER_SANITIZERS=ON -DCONVOLVER_BUILD_FUZZERS=ON -DCONVOLVER_BUILD_TESTS=OFF
          -DCONVOLVER_LEGACY_TESTS=OFF -DCONVOLVER_DOCUMENTATION_TESTS=OFF
      - name: Build fuzz targets
        run: >
          cmake --build build-fuzz
          --target fuzz_config_text fuzz_config_list fuzz_host_state fuzz_ir_file
      # CI-34: a pull request runs this workflow only when a file in FUZZED
      # changes, so that list must name every repository file compiled into
      # the targets. The debug information lists them; a new dependency fails
      # here, on the pull request that adds it.
      - name: Check that the scope list names every source
        shell: bash
        run: llvm-dwarfdump --show-sources build-fuzz/fuzz_* | python3 scripts/ci_scope.py --fuzz-sources -
      # CI-12: the campaigns run side by side, at most one per physical core,
      # so each keeps a core of its own for its whole time budget: four at once
      # on the runner's 4 CPUs gave each about half its usual executions
      # (docs/develop/testing.md#fuzz-smoke-tests-and-longer-campaigns). The
      # step fails if any campaign fails or leaves no exit status;
      # tests/fuzz/scheduler_tests.py tests that (CI-15). Each log's last lines
      # include its "Done N runs".
      - name: Run each target
        # 60 seconds each on pull requests and main, 600 on the weekly run,
        # and the input's value (600 by default) when started by hand.
        env:
          SECONDS_PER_TARGET: ${{ github.event.inputs.seconds || (github.event_name == 'schedule' && '600') || '60' }}
        run: scripts/fuzz_campaigns.sh --build build-fuzz --output fuzz-out --seconds "$SECONDS_PER_TARGET"
      - name: Keep crash inputs and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-findings
          path: |
            fuzz-out/*-crash-*
            fuzz-out/*-leak-*
            fuzz-out/*-timeout-*
            fuzz-out/*-oom-*
            fuzz-out/*.log
