---
# SPDX-License-Identifier: GPL-2.0-or-later
name: Plug-in distribution candidates

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Each Monday, so that a new upstream release of a library or NSIS shows up
  # within a week even when nothing here changes (CI-6).
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Pull requests that change only unpackaged documentation, or only the Audio
  # Unit's, LV2's or another workflow's own files (CI-13), skip the candidates
  # (scripts/ci_scope.py, docs/develop/testing.md#documentation-only-pull-requests).
  scope:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.scope.outputs.package }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: scope
        run: python3 scripts/ci_scope.py --workflow release --github-output "$GITHUB_OUTPUT"

  sources:
    needs: scope
    if: needs.scope.outputs.package == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release contracts
        run: |
          python tests/release/manifest_tests.py
          python tests/release/source_tests.py
          python tests/release/artifact_tests.py
          python tests/release/installer_tests.py
          python tests/release/gate_tests.py
          python tests/release/resolve_tests.py
          python tests/release/docs_tests.py
          python tests/release/symbols_tests.py
          python tests/release/jobs_tests.py
      # CI-6: each dependency's newest release; source-manifest.json and the
      # job summary record exactly which (version, tag, commit, checksum).
      - name: Assemble corresponding source
        run: >-
          python scripts/release/build_sources.py
          --cache build/downloads --fetch --latest
          --output build/Convolver-source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: corresponding-source
          path: build/Convolver-source.tar.gz
          if-no-files-found: error

  candidates:
    needs: sources
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2022
            platform: windows-x86_64
          # Built on macos-15: GitHub retires the macos-14 image on
          # 2 November 2026 and cancels its jobs during scheduled brownouts
          # (actions/runner-images#13518, CI-19). The package still targets
          # macOS 14 (CMAKE_OSX_DEPLOYMENT_TARGET in candidate.py).
          - os: macos-15
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CANDIDATE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # verify_artifact.py runs dumpbin, which is on PATH only in the x64
      # developer environment. This replaces ilammy/msvc-dev-cmd, whose newest
      # release (1.13.0) still targets Node 20.
      - name: Set up the MSVC x64 developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $tools = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          $vs = & $vswhere -latest -products * -requires $tools -property installationPath
          if (-not $vs) { throw "vswhere found no Visual Studio with the x64 C++ tools." }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          Write-Host "Visual Studio: $vs"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $lines = cmd /d /c "`"$vcvars`" x64 && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat x64 failed with exit code $LASTEXITCODE." }
          # vcvarsall.bat reports bad arguments on stdout and still exits 0.
          $errors = @($lines | Where-Object { $_ -match '^\[ERROR' })
          if ($errors) { throw "vcvarsall.bat x64 failed:`n$($errors -join "`n")" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -cne $Matches[2]) {
              Write-Host "Setting $($Matches[1])"
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Set-Item -Path "env:$($Matches[1])" -Value $Matches[2]
            }
          }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin) { throw "dumpbin.exe is not on PATH after vcvarsall.bat x64." }
          Write-Host "dumpbin: $($dumpbin.Source)"
      - uses: actions/download-artifact@v8
        with:
          name: corresponding-source
          path: build/source
      - name: Fetch the newest installer compiler
        id: nsis
        if: runner.os == 'Windows'
        run: python scripts/release/fetch_nsis.py --output build/nsis --github-output "$env:GITHUB_OUTPUT"
      - name: Exercise installer upgrade and locked-file recovery
        if: runner.os == 'Windows'
        run: >-
          python tests/release/windows_installer.py
          --nsis "${{ steps.nsis.outputs.makensis }}"
      # CI-10: the Linux candidate is built with networking disabled (a new
      # network namespace, back as the runner user), as anyone building the
      # corresponding source would, so no second offline build is needed.
      # An outer limit, so a test that CTest cannot end does not hold the
      # runner for GitHub's default of six hours (CI-22).
      - name: Build and verify Unix candidate
        if: runner.os != 'Windows'
        timeout-minutes: 40
        run: |
          command=(python scripts/release/candidate.py
            --archive build/source/Convolver-source.tar.gz
            --platform "$CANDIDATE_PLATFORM"
            --work build/candidate --output build/assets)
          if [ "$RUNNER_OS" = Linux ]; then
            sudo -E unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
              env PATH="$PATH" HOME="$HOME" "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Build and verify Windows candidate
        if: runner.os == 'Windows'
        timeout-minutes: 40
        run: >-
          python scripts/release/candidate.py
          --archive build/source/Convolver-source.tar.gz
          --platform windows-x86_64
          --work build/candidate --output build/assets
          --nsis "${{ steps.nsis.outputs.makensis }}"
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python scripts/release/resolve.py explain-failure
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.platform }}
          path: build/assets/*
          if-no-files-found: error
      # DIAG-1: the matching debugging symbols, outside the package and the
      # preview inventory, so a crash report can be symbolicated.
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.platform }}
          path: build/candidate/symbols
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/candidate/**/LastTest.log
            build/candidate/**/release-build-info-*.json

  collect:
    needs: candidates
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          merge-multiple: true
          path: build/assets
      - name: Check immutable preview inventory
        run: >-
          python scripts/release/collect_candidate.py
          --root build/assets --output build/assets/candidate.json
      - uses: actions/upload-artifact@v7
        with:
          name: complete-preview-candidate
          path: build/assets/*
          if-no-files-found: error
