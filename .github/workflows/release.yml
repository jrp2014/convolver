---
# SPDX-License-Identifier: GPL-2.0-or-later
name: Plug-in distribution candidates

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/develop/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
    # ready_for_review: a draft runs Lint and the Linux jobs only (CI-54).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      sign_macos:
        description: Sign and notarize both Mac packages (approval required on main or a version tag)
        type: boolean
        default: false
  # Each Monday, so that a new upstream release of a library or NSIS shows up
  # within a week even when nothing here changes (CI-6).
  schedule:
    # The first Monday run with macOS jobs; the Audio Unit and VST3 ones
    # follow half an hour apart (CI-49).
    - cron: '23 6 * * 1'

permissions:
  contents: read

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # A pull request builds the candidates only when it changes what they are
  # built from or hold: release files, packaged pages, the macOS window, the
  # build configuration or shipped dependencies (CI-34). For anything else,
  # start this workflow by hand on the branch. Pushes to main, the weekly and
  # manual runs always build them (scripts/ci_scope.py,
  # docs/develop/testing.md#when-pull-requests-build-the-candidates).
  scope:
    runs-on: ubuntu-latest
    # Reads this workflow's earlier runs, and the main commit each tested
    # against (its scope job's notice), to carry a passed result forward
    # (CI-53).
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      package: ${{ steps.scope.outputs.package }}
      full: ${{ steps.scope.outputs.full }}
      candidates: ${{ steps.scope.outputs.candidates }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check the signing ref
        if: inputs.sign_macos
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" != refs/heads/main && ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Request signing on main or a vX.Y.Z tag."
            exit 1
          fi
      - id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The candidates job's matrix, listed here so that a draft pull
          # request builds the Linux candidate alone (CI-54). Lines starting
          # with # are comments.
          # Older images on purpose: Ubuntu 22.04 keeps the Linux package
          # loading with glibc 2.35 and libstdc++ 12, and Windows Server
          # 2022's Visual Studio 2022 keeps the Windows package from needing
          # the 2026 Microsoft C++ runtime, which jrp chose to keep for now
          # (docs/develop/build.md#compilers-and-ci-machines).
          # The macOS entries are the newest generally available macOS images
          # and their newest Xcode (CI-43). The package still targets macOS 14
          # (CMAKE_OSX_DEPLOYMENT_TARGET in candidate.py).
          CANDIDATES: |
            [
              {"os": "ubuntu-22.04", "platform": "linux-x86_64"},
              {"os": "windows-2022", "platform": "windows-x86_64"},
              {"os": "macos-26", "platform": "macos-arm64"},
              {"os": "macos-26-intel", "platform": "macos-x86_64"}
            ]
        run: >-
          python3 scripts/ci_scope.py --workflow release --github-output "$GITHUB_OUTPUT" --matrix candidates=CANDIDATES
      - name: 'Full run: later pushes compare with this commit'
        if: steps.scope.outputs.proving == 'true'
        run: echo "Every job of this workflow runs, on every platform (CI-53)."

  sources:
    needs: scope
    if: needs.scope.outputs.package == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # CI-64: every tests/release/*_tests.py, found by discovery, so a new
      # test file runs without being listed here. Discovery that finds no
      # test fails (Python 3.12 and later).
      - name: Check release contracts
        run: python -m unittest discover -s tests/release -p '*_tests.py' -v
      # CI-6: each dependency's newest release; source-manifest.json and the
      # job summary record exactly which (version, tag, commit, checksum).
      - name: Assemble corresponding source
        run: >-
          python scripts/release/build_sources.py
          --cache build/downloads --fetch --latest
          --output build/Convolver-source.tar.gz
      - uses: actions/upload-artifact@v7
        with:
          name: corresponding-source
          path: build/Convolver-source.tar.gz
          if-no-files-found: error

  candidates:
    needs: [scope, sources]
    strategy:
      fail-fast: false
      matrix:
        # Listed in the scope job (CANDIDATES), which keeps only the Linux
        # candidate for a draft pull request (CI-54).
        include: ${{ fromJSON(needs.scope.outputs.candidates) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CANDIDATE_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # verify_artifact.py runs dumpbin, which is on PATH only in the x64
      # developer environment. This replaces ilammy/msvc-dev-cmd, whose newest
      # release (1.13.0) still targets Node 20.
      - name: Set up the MSVC x64 developer environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $tools = 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64'
          $vs = & $vswhere -latest -products * -requires $tools -property installationPath
          if (-not $vs) { throw "vswhere found no Visual Studio with the x64 C++ tools." }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvarsall.bat'
          Write-Host "Visual Studio: $vs"
          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $lines = cmd /d /c "`"$vcvars`" x64 && set"
          if ($LASTEXITCODE -ne 0) { throw "vcvarsall.bat x64 failed with exit code $LASTEXITCODE." }
          # vcvarsall.bat reports bad arguments on stdout and still exits 0.
          $errors = @($lines | Where-Object { $_ -match '^\[ERROR' })
          if ($errors) { throw "vcvarsall.bat x64 failed:`n$($errors -join "`n")" }
          foreach ($line in $lines) {
            if ($line -match '^([^=]+)=(.*)$' -and $before[$Matches[1]] -cne $Matches[2]) {
              Write-Host "Setting $($Matches[1])"
              "$($Matches[1])=$($Matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              Set-Item -Path "env:$($Matches[1])" -Value $Matches[2]
            }
          }
          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (-not $dumpbin) { throw "dumpbin.exe is not on PATH after vcvarsall.bat x64." }
          Write-Host "dumpbin: $($dumpbin.Source)"
      - uses: actions/download-artifact@v8
        with:
          name: corresponding-source
          path: build/source
      # LV2-5: the LV2 tests' host. The plug-in compiles against the lv2
      # headers in the corresponding source; lilv only runs the tests and is
      # not packaged.
      - name: lilv for the LV2 tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config liblilv-dev
          python scripts/release/resolve.py packages liblilv-dev liblilv-0-0
      - name: Fetch the newest installer compiler
        id: nsis
        if: runner.os == 'Windows'
        run: python scripts/release/fetch_nsis.py --output build/nsis --github-output "$env:GITHUB_OUTPUT"
      - name: Exercise installer upgrade and locked-file recovery
        if: runner.os == 'Windows'
        run: >-
          python tests/release/windows_installer.py
          --nsis "${{ steps.nsis.outputs.makensis }}"
      # The newest compiler on this image: GCC on Linux, Xcode on macOS
      # (docs/develop/build.md#compilers-and-ci-machines).
      - if: runner.os != 'Windows'
        uses: ./.github/actions/newest-compiler
        with:
          compiler: ${{ runner.os == 'macOS' && 'xcode' || 'gcc' }}
      # CI-10: the Linux candidate is built with networking disabled (a new
      # network namespace, back as the runner user), as anyone building the
      # corresponding source would, so no second offline build is needed.
      # An outer limit, so a test that CTest cannot end does not hold the
      # runner for GitHub's default of six hours (CI-22).
      - name: Build and test Unix candidate
        if: runner.os != 'Windows'
        timeout-minutes: 40
        run: |
          command=(python scripts/release/candidate.py --phase build
            --archive build/source/Convolver-source.tar.gz
            --platform "$CANDIDATE_PLATFORM" --work build/candidate)
          if [ "$RUNNER_OS" = Linux ]; then
            sudo -E unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
              env PATH="$PATH" HOME="$HOME" "${command[@]}"
          else
            "${command[@]}"
          fi
      - name: Package and verify Unix candidate
        if: runner.os != 'Windows'
        timeout-minutes: 15
        run: |
          command=(python scripts/release/candidate.py --phase package
            --archive build/source/Convolver-source.tar.gz
            --platform "$CANDIDATE_PLATFORM" --work build/candidate --output build/assets)
          if [ "$RUNNER_OS" = Linux ]; then
            sudo -E unshare --net -- setpriv --reuid="$(id -u)" --regid="$(id -g)" --init-groups \
              env PATH="$PATH" HOME="$HOME" "${command[@]}"
          else
            "${command[@]}"
          fi
      # PLUG-5, AU-5: install the macOS package on this disposable runner,
      # check where each file lands, the signatures and the installed Audio
      # Unit (au.bundle's checks and auval -strict), then uninstall. An
      # automated package check, not clean-install qualification.
      - name: Install the macOS package and validate the installed Audio Unit
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: >-
          python tests/release/macos_installer.py
          --installer build/assets/*-unsigned.pkg
          --archive "build/assets/Convolver-$(cat VERSION)-$CANDIDATE_PLATFORM.zip"
      - name: Build and test Windows candidate
        if: runner.os == 'Windows'
        timeout-minutes: 40
        run: >-
          python scripts/release/candidate.py --phase build
          --archive build/source/Convolver-source.tar.gz
          --platform windows-x86_64 --work build/candidate
      - name: Package and verify Windows candidate
        if: runner.os == 'Windows'
        timeout-minutes: 15
        run: >-
          python scripts/release/candidate.py --phase package
          --archive build/source/Convolver-source.tar.gz
          --platform windows-x86_64 --work build/candidate --output build/assets
          --nsis "${{ steps.nsis.outputs.makensis }}"
      - name: Explain a failure that may come from a new upstream release
        if: failure()
        run: python scripts/release/resolve.py explain-failure
      - uses: actions/upload-artifact@v7
        with:
          name: >-
            ${{ inputs.sign_macos && runner.os == 'macOS' && 'signing-input' || 'candidate' }}-${{ matrix.platform }}
          path: build/assets/*
          if-no-files-found: error
      # DIAG-1: the matching debugging symbols, outside the package and the
      # preview inventory, so a crash report can be symbolicated.
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.platform }}
          path: build/candidate/symbols
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: diagnostics-${{ matrix.platform }}
          path: |
            build/candidate/**/LastTest.log
            build/candidate/**/release-build-info-*.json

  sign-macos:
    needs: candidates
    if: github.event_name == 'workflow_dispatch' && inputs.sign_macos
    environment: macos-signing
    runs-on: macos-26
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-arm64, macos-x86_64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: signing-input-${{ matrix.platform }}
          path: build/input
      - name: Fetch the Developer ID intermediate certificate from Apple
        run: >-
          curl --fail --silent --show-error --retry 3
          https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          --output "$RUNNER_TEMP/DeveloperIDG2CA.cer"
      - name: Sign the tested files and notarize the plug-ins and installer
        env:
          PLATFORM: ${{ matrix.platform }}
          DEVELOPER_ID_APPLICATION_P12: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          DEVELOPER_ID_INSTALLER_P12: ${{ secrets.DEVELOPER_ID_INSTALLER_P12 }}
          DEVELOPER_ID_INSTALLER_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_PASSWORD }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: >-
          python scripts/release/sign_candidate.py --platform "$PLATFORM" --commit "$GITHUB_SHA"
          --input build/input --output build/signed
      - name: Remove temporary signing credentials
        if: always()
        run: python scripts/release/macos_signing.py --cleanup
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: candidate-${{ matrix.platform }}
          path: build/signed/*
          if-no-files-found: error

  check-signed:
    needs: sign-macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-26, platform: macos-arm64}
          - {os: macos-26-intel, platform: macos-x86_64}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v8
        with:
          name: candidate-${{ matrix.platform }}
          path: build/signed
      - uses: actions/download-artifact@v8
        with:
          name: symbols-${{ matrix.platform }}
          path: build/symbols
      - name: Verify and exercise the signed downloads
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          assets=build/signed
          archive="$assets/Convolver-$(cat VERSION)-$PLATFORM.zip"
          team=$(jq -er .macos_signing_team_id packaging/release-policy.json)
          ditto -x -k "$archive" build/unpacked
          python scripts/release/verify_artifact.py --root build/unpacked \
            --manifest build/unpacked/artifact-manifest.json \
            --source-archive "$assets/Convolver-source.tar.gz"
          python tests/release/signed_artifact.py --root build/unpacked --symbols build/symbols --team-id "$team"
          python tests/release/package_smoke.py --root build/unpacked
          python tests/release/clean_machine.py --plugin build/unpacked/VST3/Convolver.vst3
          python tests/release/macos_installer.py --archive "$archive" --installer "${archive%.zip}.pkg" \
            --team-id "$team"

  collect:
    needs: [scope, candidates, check-signed]
    # The complete candidate needs every platform, which a draft does not
    # build (CI-54).
    if: >-
      !cancelled() && needs.scope.outputs.full == 'true' && needs.candidates.result == 'success' &&
      (needs.check-signed.result == 'success' || (!inputs.sign_macos && needs.check-signed.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v8
        with:
          pattern: candidate-*
          merge-multiple: true
          path: build/assets
      - name: Check immutable preview inventory
        run: >-
          python scripts/release/collect_candidate.py
          --root build/assets --output build/assets/candidate.json
      - uses: actions/upload-artifact@v7
        with:
          name: complete-preview-candidate
          path: build/assets/*
          if-no-files-found: error
