---
# SPDX-License-Identifier: GPL-2.0-or-later
# Looks for newer releases of the pinned SDKs and test tools each week. The
# report is the run summary; on main, one open issue lists what needs
# attention and is closed when every pin is current again. Moving a pin stays
# a reviewed pull request. GitHub Actions are updated by Dependabot instead.
name: Dependency updates

'on':
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/updates.yml
      - scripts/release/check_updates.py
      - tests/release/update_tests.py

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Checker tests
        run: python tests/release/update_tests.py
      - name: Look for newer releases
        id: check
        run: >-
          python scripts/release/check_updates.py
          --markdown "$RUNNER_TEMP/report.md" --github-output "$GITHUB_OUTPUT"
          | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the tracking issue current
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTENTION: ${{ steps.check.outputs.attention }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Newer versions of pinned dependencies'
          report="$RUNNER_TEMP/report.md"
          printf '\n_Updated by the [Dependency updates run](%s)._\n' "$RUN_URL" >> "$report"
          if [ "$(gh repo view --json hasIssuesEnabled --jq .hasIssuesEnabled)" != true ]; then
            # Without issues, a failed run is the notice; the summary has the report.
            [ "$ATTENTION" != true ] || { echo "::error::Pins need attention; see the run summary."; exit 1; }
            exit 0
          fi
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")
          if [ "$ATTENTION" = true ]; then
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file "$report"
            else
              # Comment only when the findings change, so a quiet week sends nothing.
              old=$(gh issue view "$number" --json body --jq .body | sed '/^_Updated by the /d')
              if [ "$old" != "$(sed '/^_Updated by the /d' "$report")" ]; then
                gh issue edit "$number" --body-file "$report"
                gh issue comment "$number" --body "The findings changed; the description has the new report ($RUN_URL)."
              fi
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Every pin is on its newest release ($RUN_URL)."
          fi
