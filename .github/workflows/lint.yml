---
name: Documentation and workflow lint

'on':
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install lint runner
        run: python -m pip install pre-commit==4.5.1
      - name: Shell, Markdown, YAML and GitHub Actions checks
        run: pre-commit run --all-files --show-diff-on-failure
