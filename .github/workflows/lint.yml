---
# SPDX-License-Identifier: GPL-2.0-or-later
name: Lint

'on':
  # Pull requests run on their own event; a branch push without a pull
  # request can be tested with "Run workflow" (docs/testing.md#ci-triggers).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit on a pull request cancels the run for the commit it replaces.
# Pushes to main and manual runs each get a group of their own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        id: node
        with:
          node-version: '24'
      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: >-
            ${{ format('pre-commit-v1-{0}-{1}-py{2}-node{3}-{4}',
            runner.os, runner.arch, steps.python.outputs.python-version, steps.node.outputs.node-version,
            hashFiles('.pre-commit-config.yaml')) }}
      - name: Install lint runner
        run: python -m pip install pre-commit==4.5.1
      - name: Formatting, shell, Markdown, YAML, workflow and repository checks
        run: pre-commit run --all-files --show-diff-on-failure
